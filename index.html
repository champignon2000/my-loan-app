<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SCRIPT_URL = "⚠️ ใส่ลิงก์ Web App URL ของคุณที่นี่";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState("");
            const [tab, setTab] = useState("all"); 
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedUser, setSelectedUser] = useState(null);
            const [payAmount, setPayAmount] = useState("");

            useEffect(() => { loadAllData(); }, []);

            const parseCleanFloat = (val) => {
                if (!val) return 0;
                return parseFloat(val.toString().replace(/,/g, '').trim()) || 0;
            };

            const getValue = (obj, key) => obj[key] !== undefined ? obj[key] : "";

            const loadAllData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const data = await res.json();
                    setCustomers(Array.isArray(data) ? data : []);
                } catch (err) { console.error(err); }
                finally { setLoading(false); }
            };

            const handlePayment = async (e) => {
                e.preventDefault();
                setShowPayModal(false);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST", mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "recordPayment", id: selectedUser.id, amount: parseFloat(payAmount) })
                    });
                    alert("✅ บันทึกสำเร็จ");
                    setTimeout(loadAllData, 1000);
                } catch(err) { console.error(err); }
            };

            const handleCloseFloatLoan = async (cust) => {
                if (!confirm("🚨 ยืนยันปิดยอดเงินต้นถาวร?")) return;
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST", mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "closeFloatLoan", id: cust.id })
                    });
                    alert("🎉 ปิดสัญญาสำเร็จ");
                    setTimeout(loadAllData, 1000);
                } catch(err) { console.error(err); }
            };

            const isPaid = (c) => getValue(c, "status").toString().trim() === "จ่ายแล้ว";
            
            const filtered = customers.filter(c => {
                const matches = getValue(c, "name").toLowerCase().includes(search.toLowerCase());
                if (tab === "pending") return matches && !isPaid(c);
                if (tab === "paid") return matches && isPaid(c);
                return matches;
            });

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl border-x">
                    <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-4">
                        <h1 className="font-black mb-3">🚀 LoanLink Admin</h1>
                        <input type="text" placeholder="ค้นหาชื่อ..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full p-2 rounded-xl text-slate-900 text-sm" />
                    </div>

                    <div className="grid grid-cols-3 gap-1 bg-white p-1.5 border-b text-center">
                        <button onClick={() => setTab("all")} className={`py-2 text-xs font-bold rounded-lg ${tab === 'all' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500'}`}>ทั้งหมด</button>
                        <button onClick={() => setTab("pending")} className={`py-2 text-xs font-bold rounded-lg ${tab === 'pending' ? 'bg-amber-50 text-amber-700' : 'text-slate-500'}`}>ค้างชำระ</button>
                        <button onClick={() => setTab("paid")} className={`py-2 text-xs font-bold rounded-lg ${tab === 'paid' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-500'}`}>จ่ายแล้ว</button>
                    </div>

                    <div className="p-3 space-y-3">
                        {loading ? <p className="text-center py-10 text-slate-400">กำลังโหลด...</p> : filtered.map(c => {
                            const paid = isPaid(c);
                            const float = getValue(c, "loanType") === "float";
                            return (
                                <div key={getValue(c, "id")} className="bg-white p-4 rounded-2xl shadow-sm border">
                                    <div className="flex justify-between items-start mb-2">
                                        <h4 className="font-black text-slate-800">{getValue(c, "name")}</h4>
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${paid ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>{paid ? "จ่ายแล้ว" : "ค้างชำระ"}</span>
                                    </div>
                                    <div className="text-xs text-slate-600 mb-3 grid grid-cols-2 gap-y-1">
                                        <div>ยอดรวม: <strong>{parseCleanFloat(getValue(c, "total_amount")).toLocaleString()}</strong></div>
                                        <div>คงค้าง: <strong className="text-rose-600">{parseCleanFloat(getValue(c, "remaining_balance")).toLocaleString()}</strong></div>
                                        <div className="col-span-2">ประเภท: {float ? "ดอกลอย" : "รายวัน"}</div>
                                    </div>
                                    {!paid && (
                                        <button onClick={() => { setSelectedUser(c); setPayAmount(getValue(c, "cycle_payment")); setShowPayModal(true); }} className="w-full bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs mb-2">🪙 บันทึกการส่งยอด</button>
                                    )}
                                    {float && !paid && (
                                        <button onClick={() => handleCloseFloatLoan(c)} className="w-full bg-red-600 text-white font-black py-2 rounded-xl text-xs">🚨 ปิดยอดเงินต้นถาวร</button>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
