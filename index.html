<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzLq_tmiOUFVyxcPfIeRiOnm0zWhhGIpsvCn0sR4Q2GJrifIipU4oELWjVeXkxXMA_/exec"; 

        function App() {
            const [customers, setCustomers] = useState([]);
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedUser, setSelectedUser] = useState(null);
            const [payAmount, setPayAmount] = useState("");

            // ฟังก์ชันโหลดข้อมูลจาก Sheets
            const loadAllData = async () => {
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const data = await res.json();
                    setCustomers(data);
                } catch(err) { console.error("Error loading data:", err); }
            };

            useEffect(() => { loadAllData(); }, []);

            // ฟังก์ชันส่งคำสั่งไป Backend
            const sendPostRequest = async (payload) => {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                loadAllData(); // โหลดใหม่หลังทำรายการเสร็จ
            };

            return (
                <div className="max-w-md mx-auto space-y-4">
                    <h1 className="text-xl font-black text-slate-800">รายชื่อลูกหนี้</h1>
                    
                    {customers.map((c, i) => (
                        <div key={i} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <h2 className="font-bold text-lg">{c.name}</h2>
                            <p className="text-xs text-slate-500">ประเภท: {c.type} | สถานะ: {c.status}</p>
                            
                            {c.status !== "จ่ายแล้ว" && (
                                <div className="mt-4 flex flex-col gap-2">
                                    <button onClick={() => { setSelectedUser(c); setPayAmount(c.cycle_payment); setShowPayModal(true); }}
                                            className="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">
                                        🪙 บันทึกการรับชำระเงิน
                                    </button>

                                    {c.type === "float" && (
                                        <button onClick={() => { if(confirm("ปิดยอดถาวร?")) sendPostRequest({action: "closeFloatLoan", id: c.id}); }}
                                                className="w-full bg-rose-600 text-white py-2 rounded-xl text-xs font-bold">
                                            🔒 ปิดยอดเงินต้นถาวร
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    ))}

                    {/* Modal ตรงนี้จะยาวถ้าเขียนเต็ม แต่สรุปสั้นๆ คือฟอร์มรับเงิน */}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
