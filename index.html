<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzLq_tmiOUFVyxcPfIeRiOnm0zWhhGIpsvCn0sR4Q2GJrifIipU4oELWjVeXkxXMA_/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState("");
            const [tab, setTab] = useState("all"); 
            
            useEffect(() => { loadAllData(); }, []);

            const parseCleanFloat = (val) => {
                if (val === undefined || val === null || val === "") return 0;
                if (typeof val === 'number') return val;
                return parseFloat(val.toString().replace(/,/g, '').trim()) || 0;
            };

            const getValueFromSheet = (obj, targetKey, defaultValue = "") => {
                if (!obj) return defaultValue;
                return obj[targetKey] !== undefined && obj[targetKey] !== null ? obj[targetKey] : defaultValue;
            };

            const loadAllData = async () => {
                setLoading(true);
                try {
                    const resCust = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const dataCust = await resCust.json();
                    setCustomers(Array.isArray(dataCust) ? dataCust : []);
                } catch (err) { console.error(err); }
                finally { setLoading(false); }
            };

            // ฟังก์ชันคำนวณยอดรวม (Dashboard Summary)
            const getSummary = () => {
                let total = 0, paid = 0, remaining = 0;
                customers.forEach(c => {
                    total += parseCleanFloat(getValueFromSheet(c, "total_amount", 0));
                    paid += parseCleanFloat(getValueFromSheet(c, "paid_amount", 0));
                    remaining += parseCleanFloat(getValueFromSheet(c, "remaining_balance", 0));
                });
                return { total, paid, remaining };
            };

            const summary = getSummary();
            const isPaid = (c) => getValueFromSheet(c, "status", "").toString().trim() === "จ่ายแล้ว";

            const filtered = customers.filter(c => {
                const matches = getValueFromSheet(c, "name", "").toLowerCase().includes(search.toLowerCase());
                if (tab === "pending") return matches && !isPaid(c);
                if (tab === "paid") return matches && isPaid(c);
                return matches;
            });

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl">
                    {/* Header */}
                    <div className="bg-indigo-900 text-white p-4">
                        <h1 className="font-black text-xl mb-3">🚀 LoanLink Admin</h1>
                        <input type="text" placeholder="ค้นหาชื่อ..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full p-2 rounded-lg text-slate-900" />
                    </div>

                    {/* Dashboard Summary แถบสรุปผลยอด */}
                    <div className="grid grid-cols-3 gap-2 p-3 bg-white border-b">
                        <div className="bg-blue-50 p-2 rounded-lg text-center"><p className="text-[10px] text-blue-600">ยอดรวม</p><p className="font-black text-sm">{summary.total.toLocaleString()}</p></div>
                        <div className="bg-emerald-50 p-2 rounded-lg text-center"><p className="text-[10px] text-emerald-600">รับแล้ว</p><p className="font-black text-sm">{summary.paid.toLocaleString()}</p></div>
                        <div className="bg-rose-50 p-2 rounded-lg text-center"><p className="text-[10px] text-rose-600">คงค้าง</p><p className="font-black text-sm">{summary.remaining.toLocaleString()}</p></div>
                    </div>

                    {/* รายการลูกหนี้ */}
                    <div className="p-3 space-y-3">
                        {filtered.map(c => (
                            <div key={getValueFromSheet(c, "id")} className="bg-white p-4 rounded-2xl shadow-sm border">
                                <h4 className="font-bold">{getValueFromSheet(c, "name")}</h4>
                                <p className="text-xs text-slate-500">ยอดคงค้าง: {parseCleanFloat(getValueFromSheet(c, "remaining_balance")).toLocaleString()} บ.</p>
                                {getValueFromSheet(c, "loanType") === "float" && !isPaid(c) && (
                                    <button className="w-full mt-2 bg-red-600 text-white py-2 rounded-xl text-xs font-bold">🚨 ปิดยอดเงินต้น</button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
