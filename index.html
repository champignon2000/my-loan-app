<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามการชำระเงินกู้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // ⚠️ วางลิงก์ Web App (Macros) จาก Google Apps Script ของคุณที่นี่
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9NARjOg5972eVz6Uirjk4J3IL9p-Y4Y0YLvDl4Ffagdb_TNsh3Zh0rMXX2WF4y8rN/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [profiles, setProfiles] = useState([]); // ดึงข้อมูลโปรไฟล์มาใช้ตรวจสอบสถานะการลงข้อมูล
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [search, setSearch] = useState("");
            const [activeTab, setActiveTab] = useState("today");
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            
            // ฟอร์มเพิ่มข้อมูลลูกหนี้
            const [name, setName] = useState("");
            const [loanType, setLoanType] = useState("everyday"); 
            const [principal, setPrincipal] = useState("");      
            const [interestRate, setInterestRate] = useState(""); 
            const [totalLoanAmount, setTotalLoanAmount] = useState(""); 
            const [loanDate, setLoanDate] = useState(new Date().toISOString().split('T')[0]);
            const [daysLimit, setDaysLimit] = useState(""); 
            const [customCyclePayment, setCustomCyclePayment] = useState(""); 
            
            // ฟอร์มเก็บเงิน
            const [payAmount, setPayAmount] = useState("");
            const [penaltyPaid, setPenaltyPaid] = useState("0");

            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                setLoading(true);
                try {
                    // ดึงข้อมูลทั้งรายชื่อลูกหนี้และประวัติข้อมูลส่วนตัวพร้อมกัน
                    const resCust = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const dataCust = await resCust.json();
                    setCustomers(dataCust);
                    
                    const resProf = await fetch(`${SCRIPT_URL}?action=getProfiles`);
                    const dataProf = await resProf.json();
                    setProfiles(dataProf);
                    
                    setError(null);
                } catch (err) {
                    setError("ดึงข้อมูลไม่สำเร็จ กรุณาลองใหมี่อีกครั้ง");
                } finally {
                    setLoading(false);
                }
            };

            const handlePrincipalChange = (val) => {
                setPrincipal(val);
                setInterestRate("");
                setTotalLoanAmount("");
            };

            const handleInterestChange = (val) => {
                setInterestRate(val);
                const p = parseFloat(principal) || 0;
                const i = parseFloat(val) || 0;
                setTotalLoanAmount(val === "" ? "" : (p + i).toString());
            };

            const handleTotalAmountChange = (val) => {
                setTotalLoanAmount(val);
                const p = parseFloat(principal) || 0;
                const t = parseFloat(val) || 0;
                setInterestRate(val === "" ? "" : (t - p).toString());
            };

            const handleAddCustomer = async (e) => {
                e.preventDefault(); 
                setLoading(true); 
                setShowAddModal(false);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            action: "addCustomer", 
                            name, 
                            loanType, 
                            principal: parseFloat(principal),
                            interestRate: parseFloat(interestRate) || 0, 
                            loanDate,
                            customDays: parseInt(daysLimit) || 1,
                            customCyclePayment: parseFloat(customCyclePayment) || 0
                        })
                    });
                    setName(""); setPrincipal(""); setInterestRate(""); setTotalLoanAmount(""); setDaysLimit(""); setCustomCyclePayment("");
                    setLoanType("everyday"); setLoanDate(new Date().toISOString().split('T')[0]);
                    alert("🎉 ออกสัญญากู้รายใหม่สำเร็จ!");
                    setTimeout(fetchData, 1500);
                } catch (err) { alert("เกิดข้อผิดพลาด"); setLoading(false); }
            };

            const handlePayment = async (e) => {
                e.preventDefault(); 
                setLoading(true); 
                setShowPayModal(false);
                const finalAmount = (parseFloat(payAmount) || 0) + (parseFloat(penaltyPaid) || 0);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "recordPayment", id: selectedCustomer.id, amount: finalAmount })
                    });
                    setPayAmount(""); setPenaltyPaid("0");
                    alert("💵 บันทึกยอดเงินชำระเรียบร้อย!");
                    setTimeout(fetchData, 1500);
                } catch (err) { alert("เกิดข้อผิดพลาด"); setLoading(false); }
            };

            const handleDeleteCustomer = async (id, cName) => {
                if (window.confirm(`ลบรายชื่อคุณ "${cName}" ใช่หรือไม่? (ประวัติข้อมูลส่วนตัวจะถูกลบไปด้วย)`)) {
                    setLoading(true);
                    try {
                        await fetch(SCRIPT_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ action: "deleteCustomer", id })
                        });
                        setTimeout(fetchData, 1500);
                    } catch (err) { alert("ลบไม่สำเร็จ"); setLoading(false); }
                }
            };

            // ฟังก์ชันตรวจสอบว่ารหัสนี้ลงข้อมูลส่วนตัวแล้วหรือยัง
            const isProfileFilled = (id) => {
                return profiles.some(p => p.id === id);
            };

            const filteredCustomers = customers.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(search.toLowerCase());
                if (!matchesSearch) return false;
                if (activeTab === "today") return c.statusToday === "ต้องเก็บวันนี้";
                if (activeTab === "paid") return c.statusToday === "จ่ายแล้ว";
                return true; 
            });

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-2xl border-x border-slate-200">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-4 sticky top-0 z-10 shadow-md">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-xl font-black tracking-tight"><i className="fa-solid fa-piggy-bank mr-2"></i>ระบบเก็บเงินกู้</h1>
                            <div className="flex gap-2">
                                <a href="profile.html" className="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-md flex items-center gap-1 transition-all">
                                    <i className="fa-solid fa-address-book"></i> ข้อมูลส่วนตัว
                                </a>
                                <button onClick={() => setShowAddModal(true)} className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-md flex items-center gap-1 transition-all">
                                    <i className="fa-solid fa-plus"></i> เพิ่มสัญญา
                                </button>
                            </div>
                        </div>
                        <div className="relative">
                            <input type="text" placeholder="ค้นหารายชื่อลูกหนี้..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-white/15 text-white placeholder-blue-200 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:bg-white focus:text-slate-900 focus:placeholder-slate-400 focus:ring-2 focus:ring-blue-400 transition-all shadow-inner" />
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-blue-200 pointer-events-none"></i>
                        </div>
                    </div>

                    {/* Tabs */}
                    <div className="flex bg-white border-b border-slate-200 sticky top-[112px] z-10 shadow-sm text-sm">
                        <button onClick={() => setActiveTab("today")} className={`flex-1 py-3.5 text-center font-bold border-b-2 flex justify-center items-center gap-1.5 transition-all ${activeTab === "today" ? "border-blue-600 text-blue-600 bg-blue-50/40" : "border-transparent text-slate-500 hover:bg-slate-50"}`}>
                            ต้องเก็บวันนี้ ({customers.filter(c => c.statusToday === "ต้องเก็บวันนี้").length})
                        </button>
                        <button onClick={() => setActiveTab("paid")} className={`flex-1 py-3.5 text-center font-bold border-b-2 flex justify-center items-center gap-1.5 transition-all ${activeTab === "paid" ? "border-emerald-600 text-emerald-600 bg-emerald-50/40" : "border-transparent text-slate-500 hover:bg-slate-50"}`}>
                            เก็บแล้ว ({customers.filter(c => c.statusToday === "จ่ายแล้ว").length})
                        </button>
                        <button onClick={() => setActiveTab("all")} className={`flex-1 py-3.5 text-center font-bold border-b-2 flex justify-center items-center gap-1.5 transition-all ${activeTab === "all" ? "border-slate-600 text-slate-700 bg-slate-50" : "border-transparent text-slate-500 hover:bg-slate-50"}`}>
                            ทั้งหมด ({customers.length})
                        </button>
                    </div>

                    {/* List */}
                    <div className="flex-1 p-3 space-y-4 overflow-y-auto">
                        {loading ? (
                            <div className="text-center py-20 text-slate-400"><i className="fa-solid fa-circle-notch fa-spin text-3xl text-blue-600 mb-3"></i><p className="text-xs">กำลังโหลดข้อมูลและตรวจสอบข้อมูลส่วนตัว...</p></div>
                        ) : filteredCustomers.length === 0 ? (
                            <div className="text-center py-20 text-slate-400 text-sm font-medium">📭 ไม่มีรายชื่อลูกหนี้ในหมวดหมู่นี้</div>
                        ) : (
                            filteredCustomers.map(c => (
                                <div key={c.id} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm relative overflow-hidden group">
                                    <div className={`absolute top-0 left-0 bottom-0 w-1.5 ${c.loanType === 'float' ? 'bg-purple-500' : 'bg-amber-500'}`}></div>
                                    <div className="flex justify-between items-start pl-1.5">
                                        <div>
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <h3 className="font-extrabold text-slate-800 text-base">{c.name}</h3>
                                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${c.loanType === 'float' ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-800'}`}>
                                                    {c.loanType === 'float' ? '🔮 ดอกลอย' : `📅 ${c.daysLimit} งวด`}
                                                </span>
                                            </div>
                                            
                                            {/* 🛑 ระบบเช็กและแสดงสถานะการแจ้งเตือนลงข้อมูลส่วนตัวส่วนนี้ */}
                                            <div className="mt-1.5">
                                                {isProfileFilled(c.id) ? (
                                                    <span className="text-[10px] font-bold bg-emerald-100 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md"><i className="fa-solid fa-circle-check mr-1"></i>✓ ลงประวัติแล้ว</span>
                                                ) : (
                                                    <span className="text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-md"><i className="fa-solid fa-triangle-exclamation mr-1"></i>⚠️ ยังไม่ได้ลงข้อมูลส่วนตัว</span>
                                                )}
                                            </div>

                                            <p className="text-[11px] text-slate-400 mt-1 font-medium">รหัสสัญญา: <strong className="text-slate-600 font-bold">{c.id}</strong> | เริ่ม: {c.loanDate}</p>
                                        </div>
                                        <button onClick={() => handleDeleteCustomer(c.id, c.name)} className="text-slate-300 hover:text-rose-500 p-1.5 text-sm rounded-lg hover:bg-rose-50 transition-all"><i className="fa-regular fa-trash-can"></i></button>
                                    </div>
                                    
                                    <div className="bg-slate-50 rounded-xl p-3 text-xs grid grid-cols-2 gap-2 mt-2 pl-4">
                                        <div>เงินต้น: <span className="font-bold text-slate-800">{c.principal.toLocaleString()} บ.</span></div>
                                        <div>ส่งสะสมแล้ว: <span className="font-bold text-emerald-600">+{c.totalPaid.toLocaleString()} บ.</span></div>
                                        <div className="col-span-2 border-t border-slate-200/60 pt-1.5 mt-0.5">
                                            ค้างชำระปัจจุบัน: <span className="font-bold text-rose-600">{c.loanType === 'float' ? 'เก็บดอกเรื่อยๆ' : `${c.remainingBalance.toLocaleString()} บ.`}</span>
                                        </div>
                                    </div>

                                    <div className="flex items-center justify-between bg-blue-50 px-3 py-2 rounded-xl text-xs mt-2 pl-4">
                                        <span className="text-slate-600 font-medium">ค่างวดนัดเก็บทุก {c.daysLimit} วัน:</span>
                                        <span className="text-sm font-black text-blue-700">รอบละ {c.cyclePayment.toLocaleString()} บ.</span>
                                    </div>

                                    <div className="pt-2 pl-1.5">
                                        {c.statusToday === "ต้องเก็บวันนี้" ? (
                                            <button onClick={() => { setSelectedCustomer(c); setPayAmount(c.cyclePayment); setPenaltyPaid("0"); setShowPayModal(true); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-xl shadow-md transition-all">
                                                บันทึกชำระเงินงวดนี้
                                            </button>
                                        ) : (
                                            <div className="w-full bg-emerald-50 text-emerald-600 text-xs font-black py-2.5 rounded-xl text-center border border-emerald-200">
                                                <i className="fa-solid fa-circle-check mr-1"></i> งวดวันนี้เก็บเรียบร้อยแล้ว
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    {/* Modal บันทึกชำระ */}
                    {showPayModal && selectedCustomer && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                                <h3 className="text-base font-black text-slate-800 mb-3">บันทึกชำระเงิน: {selectedCustomer.name}</h3>
                                <form onSubmit={handlePayment} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ยอดเงินปกติ (บาท)</label>
                                        <input type="number" required value={payAmount} onChange={(e) => setPayAmount(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold bg-slate-50" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-rose-600 mb-1">ค่าปรับ / ล่าช้า (บาท)</label>
                                        <input type="number" value={penaltyPaid} onChange={(e) => setPenaltyPaid(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-rose-600" />
                                    </div>
                                    <div className="flex gap-2 pt-1">
                                        <button type="button" onClick={() => setShowPayModal(false)} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold">ปิด</button>
                                        <button type="submit" className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-xs font-bold">บันทึกชำระ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal เพิ่มสัญญา */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-base font-black text-slate-800 mb-4">ออกสัญญากู้รายใหม่</h3>
                                <form onSubmit={handleAddCustomer} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ชื่อ - นามสกุล ลูกหนี้</label>
                                        <input type="text" required value={name} onChange={(e) => setName(e.target.value)} placeholder="ชื่อผู้กู้" className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">รูปแบบแผนการกู้</label>
                                        <select value={loanType} onChange={(e) => { setLoanType(e.target.value); setDaysLimit(""); setCustomCyclePayment(""); setInterestRate(""); setTotalLoanAmount(""); }} className="w-full border border-slate-200 rounded-xl px-2.5 py-2.5 text-sm bg-white">
                                            <option value="everyday">📅 สัญญารายวันปกติ</option>
                                            <option value="custom">📆 กำหนดระยะงวดเอง</option>
                                            <option value="float">🔮 แผนส่ง "ดอกลอยเรื่อยๆ"</option>
                                        </select>
                                    </div>
                                    <div className="space-y-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">เงินต้นกู้ยืม (บาท)</label>
                                            <input type="number" required value={principal} onChange={(e) => handlePrincipalChange(e.target.value)} placeholder="เช่น 2000" className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold" />
                                        </div>
                                        {loanType !== 'float' && (
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="block text-xs font-bold text-amber-700 mb-1">ดอกเบี้ยรวม</label>
                                                    <input type="number" value={interestRate} onChange={(e) => handleInterestChange(e.target.value)} placeholder="เช่น 400" className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-indigo-700 mb-1">ต้น+ดอก</label>
                                                    <input type="number" value={totalLoanAmount} onChange={(e) => handleTotalAmountChange(e.target.value)} placeholder="เช่น 2400" className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="p-3 bg-blue-50 border border-blue-100 rounded-2xl space-y-3">
                                        <div>
                                            <label className="block text-xs font-bold text-blue-900 mb-1">เรียกเก็บเงินทุกๆ กี่วัน?</label>
                                            <input type="number" required placeholder="เช่น 1 หรือ 3" value={daysLimit} onChange={(e) => setDaysLimit(e.target.value)} className="w-full bg-white border border-blue-200 rounded-xl px-3 py-2 text-sm font-bold" />
                                        </div>
                                        {loanType === 'float' && (
                                            <div>
                                                <label className="block text-xs font-bold text-purple-900 mb-1">ยอดส่งดอกลอยต่อครั้ง (บาท)</label>
                                                <input type="number" required placeholder="เช่น 100" value={customCyclePayment} onChange={(e) => setCustomCyclePayment(e.target.value)} className="w-full bg-white border border-purple-200 rounded-xl px-3 py-2 text-sm font-bold" />
                                            </div>
                                        )}
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">วันที่เริ่มต้นสัญญา</label>
                                        <input type="date" required value={loanDate} onChange={(e) => setLoanDate(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold" />
                                    </div>
                                    <div className="flex gap-2.5 pt-1">
                                        <button type="button" onClick={() => setShowAddModal(false)} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-xs font-bold">ออกสัญญา</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
