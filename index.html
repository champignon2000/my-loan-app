<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามการชำระเงินกู้ (Loan Tracker)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        // ⚠️ ตรวจสอบให้มั่นใจว่าเป็นลิงก์ Web App ล่าสุดจาก Google Apps Script ของคุณนะครับ
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9NARjOg5972eVz6Uirjk4J3IL9p-Y4Y0YLvDl4Ffagdb_TNsh3Zh0rMXX2WF4y8rN/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [search, setSearch] = useState("");
            const [activeTab, setActiveTab] = useState("today");
            const [showAddModal, setShowAddModal] = useState(false);
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            
            // State ฟอร์มเพิ่มลูกหนี้
            const [name, setName] = useState("");
            const [loanType, setLoanType] = useState("daily");
            const [principal, setPrincipal] = useState("");
            const [interestRate, setInterestRate] = useState(""); 
            const [loanDate, setLoanDate] = useState(new Date().toISOString().split('T')[0]);
            const [dueDate, setDueDate] = useState(""); 
            const [customDays, setCustomDays] = useState(""); 
            
            // State สำหรับหน้าบันทึกจ่ายเงิน
            const [payAmount, setPayAmount] = useState("");
            const [penaltyPaid, setPenaltyPaid] = useState("0");

            useEffect(() => { 
                fetchData(); 
            }, []);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const data = await res.json();
                    setCustomers(data);
                    setError(null);
                } catch (err) {
                    setError("ไม่สามารถดึงข้อมูลได้ กรุณารีเฟรชหน้าจอ");
                } finally { 
                    setLoading(false); 
                }
            };

            // ฟังก์ชันคำนวณสด
            const calculatePreview = () => {
                const p = parseFloat(principal) || 0;
                const i = parseFloat(interestRate) || 0;
                const total = p + i;
                
                const percent = p > 0 ? ((i / p) * 100).toFixed(1) : "0.0";
                
                let times = 0;
                let cyclePreview = 0;

                if (loanType === "daily") {
                    times = 24;
                    cyclePreview = total / 24;
                } else if (loanType === "weekly") {
                    times = 4;
                    cyclePreview = total / 4;
                } else if (loanType === "monthly") {
                    times = 1;
                    cyclePreview = total;
                } else if (loanType === "custom") {
                    const daysInput = parseFloat(customDays) || 0;
                    times = Math.ceil(daysInput); 
                    cyclePreview = times > 0 ? total / times : 0;
                }

                return {
                    percent,
                    times,
                    cyclePreview: Math.round(cyclePreview * 100) / 100,
                    total
                };
            };

            const { percent, times, cyclePreview, total } = calculatePreview();

            const handleAddCustomer = async (e) => {
                e.preventDefault(); 
                setLoading(true); 
                setShowAddModal(false);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            action: "addCustomer", 
                            name, 
                            loanType,
                            principal: parseFloat(principal),
                            interestRate: interestRate ? parseFloat(interestRate) : 0, 
                            loanDate, 
                            dueDate: dueDate || "", 
                            customDays: loanType === "custom" ? parseInt(customDays) : null 
                        })
                    });
                    setName(""); setPrincipal(""); setLoanType("daily"); setInterestRate(""); setCustomDays(""); setDueDate("");
                    setLoanDate(new Date().toISOString().split('T')[0]);
                    setTimeout(fetchData, 1500);
                } catch (err) { 
                    alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล"); 
                    setLoading(false); 
                }
            };

            const handlePayment = async (e) => {
                e.preventDefault(); 
                setLoading(true); 
                setShowPayModal(false);
                const finalAmount = (parseFloat(payAmount) || 0) + (parseFloat(penaltyPaid) || 0);

                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "recordPayment", id: selectedCustomer.id, amount: finalAmount })
                    });
                    setPayAmount(""); setPenaltyPaid("0");
                    setTimeout(fetchData, 1500);
                } catch (err) { 
                    alert("เกิดข้อผิดพลาดในการชำระเงิน"); 
                    setLoading(false); 
                }
            };

            const handleDeleteCustomer = async (id, customerName) => {
                if (window.confirm(`คุณแน่ใจหรือไม่ที่จะลบรายชื่อคุณ "${customerName}" ออกจากระบบ?`)) {
                    setLoading(true);
                    try {
                        await fetch(SCRIPT_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ action: "deleteCustomer", id: id })
                        });
                        setTimeout(fetchData, 1500);
                    } catch (err) {
                        alert("เกิดข้อผิดพลาดในการลบข้อมูล");
                        setLoading(false);
                    }
                }
            };

            const renderStatusBadge = (c) => {
                const status = c.paymentStatusText || "";
                if (status.includes("ล่วงหน้า")) {
                    return <span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded-md text-[10px] font-bold border border-blue-100 flex items-center gap-1"><i class="fa-solid fa-angles-up"></i> จ่ายล่วงหน้า</span>;
                } else if (status.includes("ล่าช้า") || status.includes("ค้าง")) {
                    return <span class="bg-rose-50 text-rose-600 px-2 py-0.5 rounded-md text-[10px] font-bold border border-rose-100 flex items-center gap-1"><i class="fa-solid fa-triangle-exclamation animate-pulse"></i> ล่าช้า</span>;
                } else {
                    return <span class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded-md text-[10px] font-bold border border-amber-100 flex items-center gap-1"><i class="fa-solid fa-clock"></i> ตามเวลา</span>;
                }
            };

            const filteredCustomers = customers.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(search.toLowerCase());
                if (!matchesSearch) return false;
                if (activeTab === "today") return c.statusToday === "ต้องเก็บวันนี้";
                if (activeTab === "paid") return c.statusToday === "จ่ายแล้ว";
                return true; 
            });

            return (
                <div class="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-xl border-x border-slate-100">
                    {/* Header */}
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-5 shadow-md sticky top-0 z-10 rounded-b-2xl">
                        <div class="flex justify-between items-center mb-4">
                            <h1 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid
