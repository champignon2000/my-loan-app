<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIBzioIQl_VPuXG6xv2Hah2MBtqTJfzVvHgeSKdKMHyoLr_xjDt9b8fTib-mh0ezy5/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [profiles, setProfiles] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState("");
            const [tab, setTab] = useState("all");
            
            // Modal States
            const [showAddModal, setShowAddModal] = useState(false);
            const [showPayModal, setShowPayModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [selectedUser, setSelectedUser] = useState(null);
            
            // Form States
            const [editId, setEditId] = useState("");
            const [name, setName] = useState("");
            const [loanType, setLoanType] = useState("daily");
            const [principal, setPrincipal] = useState("");
            const [interestRate, setInterestRate] = useState("");
            const [customDays, setCustomDays] = useState("1");
            const [customCyclePayment, setCustomCyclePayment] = useState("");
            const [loanDate, setLoanDate] = useState("");
            const [payAmount, setPayAmount] = useState("");

            useEffect(() => { loadAllData(); }, []);

            const parseCleanFloat = (val) => parseFloat(val?.toString().replace(/,/g, '')) || 0;

            const getValueIgnoreCase = (obj, targetKey, defaultValue = "") => {
                if (!obj) return defaultValue;
                const foundKey = Object.keys(obj).find(k => k.toLowerCase().trim() === targetKey.toLowerCase().trim());
                return foundKey !== undefined ? obj[foundKey] : defaultValue;
            };

            const loadAllData = async () => {
                setLoading(true);
                try {
                    const [resCust, resProf] = await Promise.all([
                        fetch(`${SCRIPT_URL}?action=getCustomers`).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?action=getProfiles`).then(r => r.json()).catch(() => [])
                    ]);
                    setCustomers(Array.isArray(resCust) ? resCust : []);
                    setProfiles(Array.isArray(resProf) ? resProf : []);
                } catch(e) { console.error(e); }
                finally { setLoading(false); }
            };

            const resetForm = () => {
                setName(""); setPrincipal(""); setInterestRate(""); setCustomDays("1"); setCustomCyclePayment(""); setLoanDate(""); setEditId("");
            };

            const openEditModal = (c) => {
                setEditId(getValueIgnoreCase(c, "id"));
                setName(getValueIgnoreCase(c, "name"));
                setLoanType(getValueIgnoreCase(c, "loan_type", "daily"));
                setPrincipal(getValueIgnoreCase(c, "principal", 0));
                setInterestRate(getValueIgnoreCase(c, "interest_rate", 0));
                setCustomDays(getValueIgnoreCase(c, "days_count", 1));
                setCustomCyclePayment(getValueIgnoreCase(c, "cycle_payment", 0));
                setLoanDate(getValueIgnoreCase(c, "loan_date", ""));
                setShowEditModal(true);
            };

            // ... (ใส่ฟังก์ชัน handleAdd, handleEdit, handlePayment ของเดิมของคุณที่นี่ได้เลยครับ โครงสร้างนี้รองรับแล้ว)
            
            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 border-x">
                    <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-4">
                        <h1 className="font-black mb-3">🚀 LoanLink Admin</h1>
                        <input type="text" placeholder="ค้นหาชื่อ..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full p-2 rounded-xl text-slate-900 text-sm" />
                    </div>
                    {/* ส่วนแสดงผลข้อมูล */}
                    <div className="p-3 space-y-3">
                        {loading ? <p className="text-center p-10">กำลังโหลด...</p> : customers.map(c => (
                            <div key={getValueIgnoreCase(c, "id")} className="bg-white p-4 rounded-2xl shadow-sm border">
                                <h4 className="font-bold">{getValueIgnoreCase(c, "name")}</h4>
                                <button onClick={() => openEditModal(c)} className="text-amber-600">แก้ไข</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
