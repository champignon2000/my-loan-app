<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzLq_tmiOUFVyxcPfIeRiOnm0zWhhGIpsvCn0sR4Q2GJrifIipU4oELWjVeXkxXMA_/exec"; // ⚠️ อย่าลืมใส่ URL ของคุณ

        function App() {
            const [customers, setCustomers] = useState([]);
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedUser, setSelectedUser] = useState(null);
            const [payAmount, setPayAmount] = useState("");

            const loadAllData = async () => {
                const response = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                const data = await response.json();
                setCustomers(data);
            };

            useEffect(() => { loadAllData(); }, []);

            const sendPostRequest = async (payload) => {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                loadAllData();
            };

            const handlePayment = async (e) => {
                e.preventDefault();
                await sendPostRequest({ action: "recordPayment", id: selectedUser.id, amount: payAmount });
                setShowPayModal(false);
            };

            return (
                <div className="max-w-md mx-auto space-y-4">
                    <h1 className="text-xl font-black text-slate-800">รายชื่อลูกหนี้</h1>
                    
                    {customers.map((c, index) => (
                        <div key={index} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <div className="flex justify-between items-start mb-3">
                                <div>
                                    <h2 className="font-bold text-lg">{c.name}</h2>
                                    <p className="text-xs text-slate-500">ประเภท: {c.type} | สถานะ: {c.status}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-2xl font-black text-indigo-600">{Number(c.remaining_balance).toLocaleString()}</p>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase">ยอดคงเหลือ</p>
                                </div>
                            </div>

                            {c.status !== "จ่ายแล้ว" && (
                                <div className="flex flex-col gap-2">
                                    <button 
                                        onClick={() => { setSelectedUser(c); setPayAmount(c.cycle_payment); setShowPayModal(true); }}
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-xs transition-all"
                                    >
                                        🪙 รับชำระเงินงวดนี้
                                    </button>

                                    {/* ปุ่มปิดยอดเฉพาะดอกลอย */}
                                    {c.type === "float" && (
                                        <button 
                                            onClick={() => {
                                                if(confirm("ยืนยันการปิดยอดเงินต้นถาวร?")) {
                                                    sendPostRequest({ action: "closeFloatLoan", id: c.id });
                                                }
                                            }}
                                            className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-xl text-xs transition-all"
                                        >
                                            🔒 ปิดยอดเงินต้นถาวร
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    ))}

                    {/* Modal รับเงิน */}
                    {showPayModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
                            <div className="bg-white p-6 rounded-2xl w-full max-w-sm">
                                <h3 className="font-bold mb-4">รับยอดจาก: {selectedUser.name}</h3>
                                <form onSubmit={handlePayment}>
                                    <input type="number" value={payAmount} onChange={(e) => setPayAmount(e.target.value)} className="w-full p-3 border rounded-xl mb-4 text-center font-bold text-2xl text-indigo-600" />
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowPayModal(false)} className="flex-1 bg-slate-100 py-2 rounded-xl font-bold text-xs">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs">ยืนยัน</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
