<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ⚠️ นำลิงก์จากข้อ 1 (New Deployment จาก Apps Script) มาวางตรงนี้แทนตัวเดิมครับ
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxuk6Bn5suiLw22TBrDoUYNZyN-Et_ZnPpYjSV3oi-mC548qMRMScw2qTRUbS-xMjs/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [profiles, setProfiles] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState("");
            const [tab, setTab] = useState("all"); 
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedUser, setSelectedUser] = useState(null);
            const [payAmount, setPayAmount] = useState("");

            const [name, setName] = useState("");
            const [loanType, setLoanType] = useState("daily");
            const [principal, setPrincipal] = useState("");
            const [interestRate, setInterestRate] = useState("");
            const [customDays, setCustomDays] = useState(24);
            const [customCyclePayment, setCustomCyclePayment] = useState("");
            const [loanDate, setLoanDate] = useState(new Date().toISOString().split('T')[0]);

            useEffect(() => { loadAllData(); }, []);

            const loadAllData = async () => {
                setLoading(true);
                try {
                    const resCust = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const dataCust = await resCust.json();
                    
                    let dataProf = [];
                    try {
                        const resProf = await fetch(`${SCRIPT_URL}?action=getProfiles`);
                        dataProf = await resProf.json();
                    } catch(e) { console.log("ยังไม่มีประวัติในระบบ"); }

                    setCustomers(dataCust);
                    setProfiles(dataProf);
                } catch (err) {
                    console.error("เชื่อมต่อฐานข้อมูลไม่สำเร็จ", err);
                }
                setLoading(false);
            };

            const handleAddCustomer = async (e) => {
                e.preventDefault();
                setLoading(true);
                setShowAddModal(false);

                const payload = {
                    action: "addCustomer", name, loanType,
                    principal: parseFloat(principal),
                    interestRate: parseFloat(interestRate),
                    customDays: parseInt(customDays),
                    customCyclePayment: parseFloat(customCyclePayment) || 0,
                    loanDate
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    alert("🎉 ออกสัญญาเงินกู้ใหม่สำเร็จ!");
                    setName(""); setPrincipal(""); setInterestRate(""); setCustomCyclePayment("");
                    setTimeout(loadAllData, 1000);
                } catch (err) { alert("เกิดข้อผิดพลาด"); setLoading(false); }
            };

            const handlePayment = async (e) => {
                e.preventDefault();
                if (!payAmount || parseFloat(payAmount) <= 0) return;
                setLoading(true);
                setShowPayModal(false);

                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            action: "recordPayment",
                            id: selectedUser.id,
                            amount: parseFloat(payAmount)
                        })
                    });
                    alert(`✅ บันทึกการจ่ายเงิน ${payAmount} บาท เรียบร้อย!`);
                    setPayAmount("");
                    setTimeout(loadAllData, 1000);
                } catch (err) { alert("เกิดข้อผิดพลาด"); setLoading(false); }
            };

            // 🛠️ ปรับปรุงความเร็วในการอัปเดตหน้าจอหลังจากลบข้อมูลในชีตเสร็จสิ้น
            const handleDeleteCustomer = async (id, name) => {
                if (!confirm(`⚠️ คุณแน่ใจไหมที่จะลบสัญญาของ "${name}" (${id}) ข้อมูลในชีตจะหายไปถาวร?`)) return;
                setLoading(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "deleteCustomer", id: id })
                    });
                    alert("🗑️ ลบข้อมูลสัญญาออกจาก Google Sheets เรียบร้อย!");
                    setTimeout(loadAllData, 1000);
                } catch (err) { 
                    alert("เกิดข้อผิดพลาดในการลบข้อมูล"); 
                    setLoading(false); 
                }
            };

            const filtered = customers.filter(c => {
                const matchesSearch = (c.name && c.name.includes(search)) || (c.id && c.id.includes(search));
                if (!matchesSearch) return false;
                if (tab === "pending") return c.status !== "จ่ายแล้ว";
                if (tab === "paid") return c.status === "จ่ายแล้ว";
                return true;
            });

            // 📊 ฟังก์ชันคำนวณผลรวมสำหรับหน้าสรุปข้อมูล (Dashboard สรุปเงิน)
            const summary = customers.reduce((acc, c) => {
                const p = parseFloat(c.principal) || 0;
                const i = parseFloat(c.interest_rate) || 0;
                const rem = parseFloat(c.remaining_balance) || 0;
                const paid = parseFloat(c.paid_amount) || 0;

                acc.totalPrincipal += p;
                acc.totalInterest += i;
                acc.totalRemaining += rem;
                acc.totalPaid += paid;
                return acc;
            }, { totalPrincipal: 0, totalInterest: 0, totalRemaining: 0, totalPaid: 0 });

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-2xl border-x border-slate-200">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-4 sticky top-0 z-10 shadow-md">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-lg font-black tracking-tight">🚀 LoanLink Admin</h1>
                            <div className="flex gap-1.5">
                                <a href="profile.html" className="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1">
                                    <i className="fa-solid fa-address-book"></i> สมุดประวัติ
                                </a>
                                <button onClick={() => setShowAddModal(true)} className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm transition-all">
                                    <i className="fa-solid fa-plus"></i> ออกสัญญาใหม่
                                </button>
                            </div>
                        </div>
                        <div className="relative">
                            <input type="text" placeholder="ค้นหาชื่อลูกหนี้ หรือรหัสสัญญา..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-white/15 text-white placeholder-blue-200 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:bg-white focus:text-slate-900 transition-all" />
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-blue-200 pointer-events-none"></i>
                        </div>
                    </div>

                    {/* 📊 Dashboard สรุปเงินทุน */}
                    <div className="p-3 bg-gradient-to-b from-indigo-50 to-slate-50 border-b border-slate-200">
                        <div className="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/60">
                            <span className="text-[11px] font-black uppercase tracking-wider text-slate-400 block mb-2"><i className="fa-solid fa-chart-pie text-indigo-500 mr-1"></i> ภาพรวมเงินทุนในระบบ</span>
                            <div className="grid grid-cols-2 gap-2">
                                <div className="bg-blue-50/60 rounded-xl p-2.5 border border-blue-100">
                                    <span className="text-[10px] text-blue-600 font-bold block">💰 เงินต้นปล่อยทั้งหมด</span>
                                    <strong className="text-base text-blue-900 font-black">{summary.totalPrincipal.toLocaleString()} บ.</strong>
                                </div>
                                <div className="bg-emerald-50/60 rounded-xl p-2.5 border border-emerald-100">
                                    <span className="text-[10px] text-emerald-600 font-bold block">📈 ดอกเบี้ยที่สร้างได้</span>
                                    <strong className="text-base text-emerald-900 font-black">{summary.totalInterest.toLocaleString()} บ.</strong>
                                </div>
                                <div className="bg-purple-50/60 rounded-xl p-2.5 border border-purple-100">
                                    <span className="text-[10px] text-purple-600 font-bold block">📥 เก็บยอดกลับมาแล้ว</span>
                                    <strong className="text-base text-purple-900 font-black">{summary.totalPaid.toLocaleString()} บ.</strong>
                                </div>
                                <div className="bg-rose-50/60 rounded-xl p-2.5 border border-rose-100">
                                    <span className="text-[10px] text-rose-600 font-bold block">💸 ยอดค้างรอเก็บรวม</span>
                                    <strong className="text-base text-rose-600 font-black">{summary.totalRemaining.toLocaleString()} บ.</strong>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Tabs */}
                    <div className="grid grid-cols-3 gap-1 bg-white p-1.5 border-b border-slate-200">
                        <button onClick={() => setTab("all")} className={`py-2 text-xs font-bold rounded-lg transition-all ${tab === 'all' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500'}`}>ทั้งหมด ({customers.length})</button>
                        <button onClick={() => setTab("pending")} className={`py-2 text-xs font-bold rounded-lg transition-all ${tab === 'pending' ? 'bg-amber-50 text-amber-700' : 'text-slate-500'}`}>ต้องเก็บวันนี้ ({customers.filter(c => c.status !== "จ่ายแล้ว").length})</button>
                        <button onClick={() => setTab("paid")} className={`py-2 text-xs font-bold rounded-lg transition-all ${tab === 'paid' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-500'}`}>จ่ายแล้ว ({customers.filter(c => c.status === "จ่ายแล้ว").length})</button>
                    </div>

                    {/* รายชื่อ */}
                    <div className="flex-1 p-3 space-y-3 overflow-y-auto">
                        {loading ? (
                            <div className="text-center py-20 text-slate-400"><i className="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-3"></i><p className="text-xs">กำลังเชื่อมต่อตารางบัญชี...</p></div>
                        ) : filtered.length === 0 ? (
                            <div className="text-center py-20 text-slate-400 text-sm">📭 ไม่พบข้อมูลลูกหนี้ในหมวดหมู่นี้</div>
                        ) : (
                            filtered.map(c => {
                                const hasProfile = profiles.some(p => p.id === c.id);
                                return (
                                    <div key={c.id} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-xs relative overflow-hidden">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h4 className="font-black text-slate-800 text-base">{c.name}</h4>
                                                <span className="text-[11px] text-slate-400 font-mono block">ID: {c.id}</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => handleDeleteCustomer(c.id, c.name)} className="text-rose-500 hover:text-rose-700 p-1.5 text-xs bg-rose-50 rounded-lg border border-rose-100 transition-all">
                                                    <i className="fa-solid fa-trash-can"></i>
                                                </button>
                                                <span className={`text-[11px] font-black px-2.5 py-1 rounded-full ${c.status === "จ่ายแล้ว" ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>{c.status}</span>
                                            </div>
                                        </div>

                                        <div className="mb-3">
                                            {hasProfile ? (
                                                <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200"><i className="fa-solid fa-circle-check"></i> ✓ ลงประวัติแล้ว</span>
                                            ) : (
                                                <span className="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-md border border-rose-200"><i className="fa-solid fa-triangle-exclamation"></i> ⚠️ ยังไม่ได้ลงข้อมูลส่วนตัว</span>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-2 gap-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-2.5 mb-3">
                                            <div>ยอดสัญญา: <strong className="text-slate-900">{parseFloat(c.total_amount).toLocaleString()} บ.</strong></div>
                                            <div>ยอดคงเหลือ: <strong className="text-rose-600">{parseFloat(c.remaining_balance).toLocaleString()} บ.</strong></div>
                                            <div>ยอดเก็บต่อยอด: <span className="text-indigo-600 font-bold">{parseFloat(c.cycle_payment).toLocaleString()} บ.</span> ({c.days_count} วัน)</div>
                                            <div>ประเภท: <span className="text-slate-500 font-medium">{c.loan_type === "float" ? "ดอกลอย" : "รายวัน"}</span></div>
                                        </div>

                                        {c.status !== "จ่ายแล้ว" && (
                                            <button onClick={() => { setSelectedUser(c); setPayAmount(c.cycle_payment); setShowPayModal(true); }} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-xs shadow-xs transition-all">
                                                🪙 บันทึกการรับชำระเงิน
                                            </button>
                                        )}
                                    </div>
                                );
                            })
                        )}
                    </div>

                    {/* Modal ออกสัญญาใหม่ */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-base font-black text-slate-800 mb-4"><i className="fa-solid fa-file-invoice-dollar text-emerald-500 mr-1"></i> ทำสัญญาเงินกู้ใหม่</h3>
                                <form onSubmit={handleAddCustomer} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ชื่อ-นามสกุล ลูกหนี้</label>
                                        <input type="text" required value={name} onChange={(e) => setName(e.target.value)} placeholder="กรอกชื่อลูกค้า" className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ประเภทเงินกู้</label>
                                        <select value={loanType} onChange={(e) => setLoanType(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white">
                                            <option value="daily">รายวัน (ตัดต้นตัดดอก)</option>
                                            <option value="float">ดอกลอย</option>
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">เงินต้น (บาท)</label>
                                            <input type="number" required value={principal} onChange={(e) => setPrincipal(e.target.value)} placeholder="เช่น 5000" className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">ดอกเบี้ยรวม (บาท)</label>
                                            <input type="number" required value={interestRate} onChange={(e) => setInterestRate(e.target.value)} placeholder="เช่น 1000" className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                    </div>

                                    {loanType === "daily" ? (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">จำนวนวันส่ง (วัน)</label>
                                            <input type="number" value={customDays} onChange={(e) => setCustomDays(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                    ) : (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">ยอดเก็บดอกลอยต่อวัน (บาท)</label>
                                            <input type="number" required value={customCyclePayment} onChange={(e) => setCustomCyclePayment(e.target.value)} placeholder="เช่น 100" className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">วันที่เริ่มกู้</label>
                                        <input type="date" value={loanDate} onChange={(e) => setLoanDate(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowAddModal(false)} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-md">บันทึกสัญญา</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal บันทึกชำระเงิน */}
                    {showPayModal && selectedUser && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                                <h3 className="text-base font-black text-slate-800 mb-1">🪙 รับเงินจาก: {selectedUser.name}</h3>
                                <p className="text-xs text-slate-400 mb-4">รหัสสัญญา: {selectedUser.id}</p>
                                <form onSubmit={handlePayment} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">จำนวนเงินที่ส่งงวดมา (บาท)</label>
                                        <input type="number" required value={payAmount} onChange={(e) => setPayAmount(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-lg font-black text-indigo-600 bg-slate-50 text-center" />
                                    </div>
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowPayModal(false)} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold shadow-md">ยืนยันรับเงิน</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
