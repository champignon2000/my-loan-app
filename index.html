<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามการชำระเงินกู้</title>
    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // ⚠️ ใส่ลิงก์ Web App ของ Google Apps Script ของคุณที่นี่
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9NARjOg5972eVz6Uirjk4J3IL9p-Y4Y0YLvDl4Ffagdb_TNsh3Zh0rMXX2WF4y8rN/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [search, setSearch] = useState("");
            const [activeTab, setActiveTab] = useState("today");
            
            // ปิด-เปิด หน้าต่าง (Modal)
            const [showAddModal, setShowAddModal] = useState(false);
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            
            // ฟอร์มเพิ่มลูกหนี้
            const [name, setName] = useState("");
            const [loanType, setLoanType] = useState("everyday"); 
            const [principal, setPrincipal] = useState("");      // เงินต้น
            const [interestRate, setInterestRate] = useState(""); // ดอกเบี้ยรวม
            const [totalLoanAmount, setTotalLoanAmount] = useState(""); // ยอดรวม (ต้น + ดอก)
            const [loanDate, setLoanDate] = useState(new Date().toISOString().split('T')[0]);
            const [daysLimit, setDaysLimit] = useState(""); 
            
            // ฟอร์มเก็บเงิน
            const [payAmount, setPayAmount] = useState("");
            const [penaltyPaid, setPenaltyPaid] = useState("0");

            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const data = await res.json();
                    setCustomers(data);
                    setError(null);
                } catch (err) {
                    setError("ดึงข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
                } finally { setLoading(false); }
            };

            // --- ฟังก์ชันผูกสูตรคำนวณอัตโนมัติ (ยกเว้นต้น) ---
            const handlePrincipalChange = (val) => {
                setPrincipal(val);
                // เมื่อเปลี่ยนต้น ให้ล้างค่าดอกเบี้ยและยอดรวม เพื่อให้พิมพ์จับคู่ใหม่ป้องกันค่าเก่าค้าง
                setInterestRate("");
                setTotalLoanAmount("");
            };

            const handleInterestChange = (val) => {
                setInterestRate(val);
                const p = parseFloat(principal) || 0;
                const i = parseFloat(val) || 0;
                // พิมพ์ดอกเบี้ย -> เติมช่องยอดรวมให้เอง (ต้น + ดอก)
                if (val === "") {
                    setTotalLoanAmount("");
                } else {
                    setTotalLoanAmount((p + i).toString());
                }
            };

            const handleTotalAmountChange = (val) => {
                setTotalLoanAmount(val);
                const p = parseFloat(principal) || 0;
                const t = parseFloat(val) || 0;
                // พิมพ์ยอดรวม -> เติมช่องดอกเบี้ยให้เอง (ยอดรวม - ต้น)
                if (val === "") {
                    setInterestRate("");
                } else {
                    setInterestRate((t - p).toString());
                }
            };

            // คำนวณจำนวนครั้งและงวดส่ง
            const finalTotal = parseFloat(totalLoanAmount) || 0;
            const inputNumber = parseFloat(daysLimit) || 0;
            let calculatedTimes = 0;
            if (inputNumber > 0) {
                calculatedTimes = inputNumber;
            }
            const calculatedInstallment = calculatedTimes > 0 ? Math.round((finalTotal / calculatedTimes) * 100) / 100 : 0;

            const handleAddCustomer = async (e) => {
                e.preventDefault(); 
                setLoading(true); 
                setShowAddModal(false);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            action: "addCustomer", 
                            name, 
                            loanType: loanType === "everyday" ? "daily" : "custom",
                            principal: parseFloat(principal),
                            interestRate: parseFloat(interestRate) || 0, 
                            loanDate,
                            customDays: parseInt(daysLimit)
                        })
                    });
                    setName(""); setPrincipal(""); setInterestRate(""); setTotalLoanAmount(""); setDaysLimit("");
                    setLoanType("everyday"); setLoanDate(new Date().toISOString().split('T')[0]);
                    setTimeout(fetchData, 1500);
                } catch (err) { 
                    alert("เกิดข้อผิดพลาด"); setLoading(false); 
                }
            };

            const handlePayment = async (e) => {
                e.preventDefault(); 
                setLoading(true); 
                setShowPayModal(false);
                const finalAmount = (parseFloat(payAmount) || 0) + (parseFloat(penaltyPaid) || 0);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "recordPayment", id: selectedCustomer.id, amount: finalAmount })
                    });
                    setPayAmount(""); setPenaltyPaid("0");
                    setTimeout(fetchData, 1500);
                } catch (err) { 
                    alert("เกิดข้อผิดพลาด"); setLoading(false); 
                }
            };

            const handleDeleteCustomer = async (id, cName) => {
                if (window.confirm(`ลบรายชื่อคุณ "${cName}" ใช่หรือไม่?`)) {
                    setLoading(true);
                    try {
                        await fetch(SCRIPT_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ action: "deleteCustomer", id })
                        });
                        setTimeout(fetchData, 1500);
                    } catch (err) { alert("ลบไม่สำเร็จ"); setLoading(false); }
                }
            };

            const filteredCustomers = customers.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(search.toLowerCase());
                if (!matchesSearch) return false;
                if (activeTab === "today") return c.statusToday === "ต้องเก็บวันนี้";
                if (activeTab === "paid") return c.statusToday === "จ่ายแล้ว";
                return true; 
            });

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-xl">
                    {/* ส่วนหัวแอป */}
                    <div className="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-sm">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-lg font-bold"><i className="fa-solid fa-wallet mr-1"></i> ระบบเก็บเงินกู้</h1>
                            <button onClick={() => setShowAddModal(true)} className="bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm hover:bg-emerald-600 active:scale-95 transition">
                                <i className="fa-solid fa-plus mr-1"></i> เพิ่มลูกหนี้ใหม่
                            </button>
                        </div>
                        <div className="relative">
                            <input type="text" placeholder="พิมพ์ชื่อเพื่อค้นหา..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-white text-slate-800 placeholder-slate-400 pl-9 pr-4 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                        </div>
                    </div>

                    {/* แท็บสลับหน้าจอ */}
                    <div className="flex bg-white border-b border-slate-200 sticky top-[108px] z-10 text-sm">
                        <button onClick={() => setActiveTab("today")} className={`flex-1 py-3 text-center font-bold border-b-2 ${activeTab === "today" ? "border-blue-600 text-blue-600" : "border-transparent text-slate-500"}`}>
                            ต้องเก็บ ({customers.filter(c => c.statusToday === "ต้องเก็บวันนี้").length})
                        </button>
                        <button onClick={() => setActiveTab("paid")} className={`flex-1 py-3 text-center font-bold border-b-2 ${activeTab === "paid" ? "border-blue-600 text-blue-600" : "border-transparent text-slate-500"}`}>
                            จ่ายแล้ว ({customers.filter(c => c.statusToday === "จ่ายแล้ว").length})
                        </button>
                        <button onClick={() => setActiveTab("all")} className={`flex-1 py-3 text-center font-bold border-b-2 ${activeTab === "all" ? "border-blue-600 text-blue-600" : "border-transparent text-slate-500"}`}>
                            ทั้งหมด ({customers.length})
                        </button>
                    </div>

                    {/* รายชื่อลูกหนี้ */}
                    <div className="flex-1 p-3 space-y-3 overflow-y-auto">
                        {loading ? (
                            <div className="text-center py-12 text-slate-400"><i className="fa-solid fa-circle-notch fa-spin text-2xl text-blue-600 mb-2"></i><p className="text-xs">กำลังโหลดข้อมูล...</p></div>
                        ) : error ? (
                            <div className="text-center py-12 text-rose-500 text-sm font-bold">{error}</div>
                        ) : filteredCustomers.length === 0 ? (
                            <div className="text-center py-12 text-slate-400 text-sm">ไม่มีรายชื่อในหมวดนี้</div>
                        ) : (
                            filteredCustomers.map(c => (
                                <div key={c.id} className="bg-white border border-slate-100 rounded-xl p-3.5 shadow-xs flex flex-col gap-2">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                <h3 className="font-bold text-slate-800 text-base">{c.name}</h3>
                                                <span className={`text-[10px] px-1.5 py-0.5 rounded-sm font-bold ${c.paymentStatusText?.includes('ล่าช้า') ? 'bg-rose-50 text-rose-600 border border-rose-100' : 'bg-slate-100 text-slate-600'}`}>{c.paymentStatusText || 'ปกติ'}</span>
                                            </div>
                                            <p className="text-[11px] text-slate-400 mt-0.5">เริ่ม: {c.loanDate || '-'} | ครบกำหนด: {c.dueDate || '-'}</p>
                                        </div>
                                        <button onClick={() => handleDeleteCustomer(c.id, c.name)} className="text-slate-300 hover:text-rose-500 p-1 text-xs transition"><i className="fa-regular fa-trash-can"></i></button>
                                    </div>
                                    
                                    {/* รายละเอียดหนี้เงินกู้ */}
                                    <div className="bg-slate-50 rounded-lg p-2 text-xs grid grid-cols-2 gap-x-2 gap-y-1 text-slate-600">
                                        <div>เงินต้น+ดอกเบี้ย: <strong className="text-slate-800">{parseFloat(c.principal) + parseFloat(c.interestRate || 0)} บ.</strong></div>
                                        <div>ต้องส่งครั้งละ: <strong className="text-blue-600">{c.cyclePayment} บ.</strong></div>
                                        <div>ส่งแล้วทั้งหมด: <strong className="text-emerald-600">{c.totalPaid || 0} บ.</strong></div>
                                        <div>ยอดค้างเหลืออยู่: <strong className="text-rose-600">{c.remainingBalance || 0} บ.</strong></div>
                                    </div>

                                    {/* ปุ่มกดเก็บเงิน */}
                                    <div className="flex justify-end pt-1">
                                        {c.statusToday === "ต้องเก็บวันนี้" ? (
                                            <button onClick={() => { setSelectedCustomer(c); setPayAmount(c.cyclePayment); setPenaltyPaid("0"); setShowPayModal(true); }} className="w-full bg-blue-600 text-white text-xs font-bold py-2 rounded-xl shadow-xs hover:bg-blue-700 active:scale-95 transition">คลิกเก็บเงินประจำวันนี้</button>
                                        ) : (
                                            <div className="w-full bg-emerald-50 text-emerald-600 text-xs font-bold py-2 rounded-xl text-center border border-emerald-200"><i className="fa-solid fa-check-circle mr-1"></i> จ่ายเรียบร้อยแล้ว</div>
                                        )}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    {/* หน้าต่าง: บันทึกเก็บเงิน */}
                    {showPayModal && selectedCustomer && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-xl p-5 shadow-xl">
                                <h3 className="text-base font-bold text-slate-800 mb-3"><i className="fa-solid fa-calculator text-blue-600 mr-1"></i> บันทึกเก็บเงินประจำรอบ</h3>
                                <div className="text-xs text-slate-600 mb-4 bg-slate-50 p-2 rounded-lg">ลูกหนี้: <strong className="text-slate-800">{selectedCustomer.name}</strong> (ยอดค้างรวม: {selectedCustomer.remainingBalance} บ.)</div>
                                <form onSubmit={handlePayment} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ยอดเงินงวดปกติ (บาท)</label>
                                        <input type="number" required value={payAmount} onChange={(e) => setPayAmount(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-rose-600 mb-1">ค่าปรับล่าช้า/ค่าเอกสารเพิ่ม (ถ้ามี)</label>
                                        <input type="number" value={penaltyPaid} onChange={(e) => setPenaltyPaid(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-rose-600 focus:outline-none focus:border-rose-500" />
                                    </div>
                                    <div className="text-xs text-slate-500 text-center pt-1">ยอดรวมบันทึกเข้าหน้าชีต: <strong className="text-emerald-600 text-sm">{(parseFloat(payAmount)||0) + (parseFloat(penaltyPaid)||0)}</strong> บาท</div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowPayModal(false)} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-200">ปิด</button>
                                        <button type="submit" className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-xs font-bold shadow-xs hover:bg-blue-700">บันทึกชำระ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* หน้าต่าง: เพิ่มข้อมูลลูกหนี้ */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-xl p-5 shadow-xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-base font-bold text-slate-800 mb-4"><i className="fa-solid fa-user-plus text-blue-600 mr-1"></i> เพิ่มลูกหนี้ใหม่</h3>
                                <form onSubmit={handleAddCustomer} className="space-y-3.5">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ชื่อ - นามสกุล</label>
                                        <input type="text" required value={name} onChange={(e) => setName(e.target.value)} placeholder="กรอกชื่อลูกหนี้" className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
                                    </div>
                                    
                                    {/* ส่วนกรอกตัวเลขเงิน (มีระบบคำนวณอัตโนมัติ) */}
                                    <div className="space-y-2.5 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">1. เงินต้น (บาท)</label>
                                            <input type="number" required value={principal} onChange={(e) => handlePrincipalChange(e.target.value)} placeholder="เช่น 10000" className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-xs font-bold text-amber-700 mb-1">2. ดอกเบี้ยรวม (บาท)</label>
                                                <input type="number" value={interestRate} onChange={(e) => handleInterestChange(e.target.value)} placeholder="เช่น 2000" className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-indigo-700 mb-1">3. ต้น + ดอกเบี้ย (บาท)</label>
                                                <input type="number" value={totalLoanAmount} onChange={(e) => handleTotalAmountChange(e.target.value)} placeholder="เช่น 12000" className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
                                            </div>
                                        </div>
                                        <p className="text-[10px] text-slate-400 text-center">*กรอกข้อ 1 แล้วเลือกพิมพ์ข้อ 2 หรือ ข้อ 3 ระบบจะคำนวณอีกช่องให้ทันที</p>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">เงื่อนไขการส่งเงิน</label>
                                        <select value={loanType} onChange={(e) => { setLoanType(e.target.value); setDaysLimit(""); }} className="w-full border border-slate-200 rounded-xl px-2.5 py-2 text-sm focus:outline-none focus:border-blue-500 bg-white">
                                            <option value="everyday">ส่งทุกวัน (รายวัน)</option>
                                            <option value="custom">กำหนดช่วงวันเอง (เช่น ทุก 3 วัน หรือ นานๆ ส่งครั้ง)</option>
                                        </select>
                                    </div>

                                    <div className="p-3 bg-blue-50/70 border border-blue-100 rounded-xl">
                                        <label className="block text-xs font-bold text-blue-800 mb-1">
                                            {loanType === "everyday" ? "สัญญากู้ทั้งหมดกี่วัน (วัน)" : "กี่วันตัดดอก 1 ครั้ง หรือต้องส่งทั้งหมดกี่งวด"}
                                        </label>
                                        <input type="number" required placeholder={loanType === "everyday" ? "กรอกจำนวนวันทั้งหมด เช่น 24" : "เช่น กรอก 3 หรือจำนวนงวด"} value={daysLimit} onChange={(e) => setDaysLimit(e.target.value)} className="w-full bg-white border border-blue-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">วันที่ปล่อยกู้ (เริ่มต้นสัญญา)</label>
                                        <input type="date" required value={loanDate} onChange={(e) => setLoanDate(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-blue-500" />
                                    </div>

                                    {/* กล่องสรุปหนี้สินและงวดที่จะถูกส่งเก็บเงินจริง */}
                                    <div className="bg-slate-800 text-slate-100 rounded-xl p-3 text-xs space-y-1">
                                        <div className="flex justify-between"><span>ยอดเงินรวมที่จะตั้งในระบบ:</span><span className="font-bold text-white">{finalTotal} บ.</span></div>
                                        <div className="flex justify-between"><span>จำนวนครั้งที่ต้องเก็บ:</span><span className="font-bold text-amber-400">{calculatedTimes} ครั้ง</span></div>
                                        <div className="flex justify-between border-t border-slate-700 pt-1 text-sm text-emerald-400 font-bold"><span>ยอดเก็บต่อครั้ง:</span><span>{calculatedInstallment} บ.</span></div>
                                    </div>

                                    <div className="flex gap-2 pt-1">
                                        <button type="button" onClick={() => setShowAddModal(false)} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-200">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-xs font-bold shadow-sm hover:bg-blue-700">บันทึกข้อมูลลงระบบ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
