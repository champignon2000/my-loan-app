<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามค่างวดลูกหนี้</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

// =========================
// ใส่ URL Apps Script
// =========================

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzB3it76e41Cx_3DayHlvkZgbSg4A8fG1Av_92m3Kj0iYBaIAJcp5cKF4e4tE5aDAlo/exec";

// =========================
// APP
// =========================

function App() {

    const [customers, setCustomers] = useState([]);
    const [loading, setLoading] = useState(true);

    const [search, setSearch] = useState("");
    const [tab, setTab] = useState("all");

    const [showPayModal, setShowPayModal] = useState(false);

    const [selectedUser, setSelectedUser] = useState(null);

    const [payAmount, setPayAmount] = useState("");

    // =========================
    // LOAD DATA
    // =========================

    useEffect(() => {
        loadData();
    }, []);

    const loadData = async () => {

        setLoading(true);

        try {

            const res = await fetch(
                `${SCRIPT_URL}?action=getCustomers`
            );

            const data = await res.json();

            setCustomers(Array.isArray(data) ? data : []);

        } catch(err) {

            console.error(err);

        } finally {

            setLoading(false);
        }
    };

    // =========================
    // HELPERS
    // =========================

    const parseNum = (val) => {

        if (!val) return 0;

        return Number(
            val.toString().replace(/,/g, "")
        ) || 0;
    };

    const getVal = (obj, key, defaultVal = "") => {

        if (!obj) return defaultVal;

        const keys = Object.keys(obj);

        const found = keys.find(k =>
            k.toLowerCase() === key.toLowerCase()
        );

        return found ? obj[found] : defaultVal;
    };

    // =========================
    // PAYMENT
    // =========================

    const handlePayment = async (e) => {

        e.preventDefault();

        if (!payAmount) return;

        try {

            await fetch(SCRIPT_URL, {

                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    action: "recordPayment",

                    id: selectedUser.id,

                    amount: parseFloat(payAmount)
                })
            });

            alert("บันทึกรับเงินสำเร็จ");

            setShowPayModal(false);

            setPayAmount("");

            setTimeout(loadData, 1200);

        } catch(err) {

            console.error(err);

            alert("เกิดข้อผิดพลาด");
        }
    };

    // =========================
    // CLOSE FLOAT LOAN
    // =========================

    const closeFloatLoan = async (id) => {

        if (!confirm("ยืนยันปิดยอดเงินต้น?")) return;

        try {

            await fetch(SCRIPT_URL, {

                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    action: "closeFloatLoan",

                    id: id
                })
            });

            alert("ปิดยอดสำเร็จ");

            setTimeout(loadData, 1200);

        } catch(err) {

            console.error(err);

            alert("เกิดข้อผิดพลาด");
        }
    };

    // =========================
    // FILTER
    // =========================

    const filtered = customers.filter(c => {

        const name = getVal(c, "name", "")
            .toLowerCase();

        const id = getVal(c, "id", "")
            .toLowerCase();

        const s = search.toLowerCase();

        return (
            name.includes(s) ||
            id.includes(s)
        );
    });

    // =========================
    // SUMMARY
    // =========================

    const summary = customers.reduce((acc, c) => {

        acc.totalPrincipal += parseNum(
            getVal(c, "principal", 0)
        );

        acc.totalRemaining += parseNum(
            getVal(c, "remaining_balance", 0)
        );

        acc.totalPaid += parseNum(
            getVal(c, "paid_amount", 0)
        );

        return acc;

    }, {
        totalPrincipal: 0,
        totalRemaining: 0,
        totalPaid: 0
    });

    // =========================
    // UI
    // =========================

    return (

        <div className="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl">

            {/* HEADER */}

            <div className="bg-indigo-700 text-white p-4">

                <h1 className="text-xl font-black mb-3">
                    ระบบเงินกู้
                </h1>

                <input
                    type="text"
                    placeholder="ค้นหา..."
                    value={search}
                    onChange={(e)=>setSearch(e.target.value)}
                    className="w-full rounded-xl px-4 py-2 text-black"
                />
            </div>

            {/* SUMMARY */}

            <div className="grid grid-cols-3 gap-2 p-3">

                <div className="bg-white p-3 rounded-xl">
                    <div className="text-xs text-slate-400">
                        เงินต้น
                    </div>

                    <div className="font-black text-blue-700">
                        {summary.totalPrincipal.toLocaleString()}
                    </div>
                </div>

                <div className="bg-white p-3 rounded-xl">
                    <div className="text-xs text-slate-400">
                        รับแล้ว
                    </div>

                    <div className="font-black text-emerald-700">
                        {summary.totalPaid.toLocaleString()}
                    </div>
                </div>

                <div className="bg-white p-3 rounded-xl">
                    <div className="text-xs text-slate-400">
                        คงเหลือ
                    </div>

                    <div className="font-black text-rose-700">
                        {summary.totalRemaining.toLocaleString()}
                    </div>
                </div>

            </div>

            {/* LIST */}

            <div className="p-3 space-y-3">

                {loading ? (

                    <div className="text-center py-20">
                        Loading...
                    </div>

                ) : filtered.length === 0 ? (

                    <div className="text-center py-20">
                        ไม่มีข้อมูล
                    </div>

                ) : (

                    filtered.map(c => {

                        const id = getVal(c, "id", "");

                        const name = getVal(c, "name", "");

                        const type = getVal(c, "loanType", "");

                        const principal = parseNum(
                            getVal(c, "principal", 0)
                        );

                        const paid = parseNum(
                            getVal(c, "paid_amount", 0)
                        );

                        const remaining = parseNum(
                            getVal(c, "remaining_balance", 0)
                        );

                        const cycle = parseNum(
                            getVal(c, "cycle_payment", 0)
                        );

                        const status = getVal(
                            c,
                            "status",
                            "ค้างชำระ"
                        );

                        return (

                            <div
                                key={id}
                                className="bg-white p-4 rounded-2xl border border-slate-200"
                            >

                                <div className="flex justify-between">

                                    <div>

                                        <div className="font-black">
                                            {name}
                                        </div>

                                        <div className="text-xs text-slate-400">
                                            {id}
                                        </div>

                                    </div>

                                    <div>

                                        <span className={`text-xs px-2 py-1 rounded-full font-bold ${
                                            status === "จ่ายแล้ว"
                                            ? "bg-emerald-100 text-emerald-700"
                                            : "bg-amber-100 text-amber-700"
                                        }`}>

                                            {status}

                                        </span>

                                    </div>

                                </div>

                                <div className="mt-3 text-sm space-y-1">

                                    <div>
                                        ประเภท:
                                        <strong className="ml-1">
                                            {
                                                type === "float"
                                                ? "ดอกลอย"
                                                : "รายวัน"
                                            }
                                        </strong>
                                    </div>

                                    <div>
                                        เงินต้น:
                                        <strong className="ml-1">
                                            {principal.toLocaleString()}
                                        </strong>
                                    </div>

                                    <div>
                                        รับแล้ว:
                                        <strong className="ml-1 text-emerald-600">
                                            {paid.toLocaleString()}
                                        </strong>
                                    </div>

                                    <div>
                                        คงเหลือ:
                                        <strong className="ml-1 text-rose-600">
                                            {remaining.toLocaleString()}
                                        </strong>
                                    </div>

                                    <div>
                                        เก็บต่อรอบ:
                                        <strong className="ml-1">
                                            {cycle.toLocaleString()}
                                        </strong>
                                    </div>

                                </div>

                                <div className="grid grid-cols-2 gap-2 mt-4">

                                    <button
                                        onClick={() => {

                                            setSelectedUser({
                                                id,
                                                name
                                            });

                                            setPayAmount(cycle);

                                            setShowPayModal(true);
                                        }}

                                        className="bg-indigo-600 text-white rounded-xl py-2 text-sm font-bold"
                                    >
                                        รับเงิน
                                    </button>

                                    {
                                        type === "float" &&
                                        status !== "จ่ายแล้ว" && (

                                            <button
                                                onClick={() =>
                                                    closeFloatLoan(id)
                                                }

                                                className="bg-rose-600 text-white rounded-xl py-2 text-sm font-bold"
                                            >
                                                ปิดยอด
                                            </button>
                                        )
                                    }

                                </div>

                            </div>
                        );
                    })
                )}
            </div>

            {/* MODAL */}

            {
                showPayModal &&
                selectedUser && (

                    <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">

                        <div className="bg-white rounded-2xl p-5 w-full max-w-sm">

                            <h3 className="font-black mb-4">

                                รับเงินจาก

                                <div className="text-indigo-600 mt-1">
                                    {selectedUser.name}
                                </div>

                            </h3>

                            <form onSubmit={handlePayment}>

                                <input
                                    type="number"
                                    value={payAmount}
                                    onChange={(e)=>setPayAmount(e.target.value)}
                                    className="w-full border rounded-xl px-4 py-3 text-center text-2xl font-black mb-4"
                                />

                                <div className="grid grid-cols-2 gap-2">

                                    <button
                                        type="button"
                                        onClick={()=>setShowPayModal(false)}
                                        className="bg-slate-100 rounded-xl py-3"
                                    >
                                        ยกเลิก
                                    </button>

                                    <button
                                        type="submit"
                                        className="bg-indigo-600 text-white rounded-xl py-3 font-bold"
                                    >
                                        ยืนยัน
                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>
                )
            }

        </div>
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
