<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ⚠️ ใส่ลิงก์ Web App URL ของคุณที่นี่
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzLq_tmiOUFVyxcPfIeRiOnm0zWhhGIpsvCn0sR4Q2GJrifIipU4oELWjVeXkxXMA_/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState("");
            const [tab, setTab] = useState("all"); 
            
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedUser, setSelectedUser] = useState(null);
            const [payAmount, setPayAmount] = useState("");

            useEffect(() => { loadAllData(); }, []);

            const parseCleanFloat = (val) => {
                if (val === undefined || val === null || val === "") return 0;
                if (typeof val === 'number') return val;
                return parseFloat(val.toString().replace(/,/g, '').trim()) || 0;
            };

            const getValueFromSheet = (obj, targetKey, defaultValue = "") => {
                if (!obj) return defaultValue;
                return obj[targetKey] !== undefined && obj[targetKey] !== null ? obj[targetKey] : defaultValue;
            };

            const loadAllData = async () => {
                setLoading(true);
                try {
                    const resCust = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const dataCust = await resCust.json();
                    setCustomers(Array.isArray(dataCust) ? dataCust : []);
                } catch (err) { console.error(err); }
                finally { setLoading(false); }
            };

            const handlePayment = async (e) => {
                e.preventDefault();
                if (!payAmount || parseFloat(payAmount) <= 0) return;
                if (!confirm(`🪙 ยืนยันบันทึกยอดชำระจำนวน ${parseFloat(payAmount).toLocaleString()} บาท?`)) return;
                
                setShowPayModal(false);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "recordPayment", id: selectedUser.id, amount: parseFloat(payAmount) })
                    });
                    alert(`✅ บันทึกยอดสำเร็จ!`);
                    setPayAmount("");
                    setTimeout(loadAllData, 1000);
                } catch(err) { console.error(err); }
            };

            const checkIfPaidSuccess = (c) => {
                return getValueFromSheet(c, "status", "ค้างชำระ").toString().trim() === "จ่ายแล้ว";
            };

            const filtered = customers.filter(c => {
                const cName = getValueFromSheet(c, "name", "").toString();
                const matchesSearch = cName.toLowerCase().includes(search.toLowerCase());
                
                const isPaid = checkIfPaidSuccess(c);
                if (tab === "pending") return matchesSearch && !isPaid;
                if (tab === "paid") return matchesSearch && isPaid;
                return matchesSearch; 
            });

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-2xl border-x border-slate-200">
                    {/* Header เดิม */}
                    <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-4 sticky top-0 z-10 shadow-md">
                        <h1 className="text-lg font-black tracking-tight mb-3">🚀 LoanLink Admin</h1>
                        <div className="relative">
                            <input type="text" placeholder="ค้นหาชื่อลูกหนี้..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-white/15 text-white placeholder-blue-200 pl-10 pr-4 py-2 rounded-xl text-sm focus:outline-none focus:bg-white focus:text-slate-900" />
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-blue-200 pointer-events-none"></i>
                        </div>
                    </div>

                    {/* Tabs เดิม */}
                    <div className="grid grid-cols-3 gap-1 bg-white p-1.5 border-b border-slate-200 text-center">
                        <button onClick={() => setTab("all")} className={`py-2 text-xs font-bold rounded-lg ${tab === 'all' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500'}`}>ทั้งหมด</button>
                        <button onClick={() => setTab("pending")} className={`py-2 text-xs font-bold rounded-lg ${tab === 'pending' ? 'bg-amber-50 text-amber-700' : 'text-slate-500'}`}>ค้างชำระ</button>
                        <button onClick={() => setTab("paid")} className={`py-2 text-xs font-bold rounded-lg ${tab === 'paid' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-500'}`}>จ่ายแล้ว</button>
                    </div>

                    {/* รายการลูกหนี้เดิม */}
                    <div className="flex-1 p-3 space-y-3 overflow-y-auto">
                        {loading ? (
                            <div className="text-center py-20 text-slate-400">กำลังโหลดข้อมูล...</div>
                        ) : filtered.map(c => {
                            const isPaid = checkIfPaidSuccess(c);
                            return (
                                <div key={getValueFromSheet(c, "id")} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                    <div className="flex justify-between items-start mb-2">
                                        <h4 className="font-black text-slate-800">{getValueFromSheet(c, "name")}</h4>
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${isPaid ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>
                                            {isPaid ? "จ่ายแล้ว" : "ค้างชำระ"}
                                        </span>
                                    </div>
                                    <div className="text-xs text-slate-600 mb-3">
                                        ยอดคงค้าง: <strong className="text-rose-600">{parseCleanFloat(getValueFromSheet(c, "remaining_balance")).toLocaleString()} บ.</strong>
                                    </div>
                                    {!isPaid && (
                                        <button onClick={() => { setSelectedUser(c); setPayAmount(getValueFromSheet(c, "cycle_payment")); setShowPayModal(true); }} className="w-full bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs">
                                            🪙 บันทึกการส่งดอกรอบนี้
                                        </button>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {/* Modal */}
                    {showPayModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                                <h3 className="font-bold mb-4">บันทึกรับยอดเงิน</h3>
                                <input type="number" value={payAmount} onChange={(e) => setPayAmount(e.target.value)} className="w-full border rounded-xl p-3 mb-4" />
                                <div className="flex gap-2">
                                    <button onClick={() => setShowPayModal(false)} className="flex-1 bg-slate-200 py-2 rounded-xl">ยกเลิก</button>
                                    <button onClick={handlePayment} className="flex-1 bg-indigo-600 text-white py-2 rounded-xl">ยืนยัน</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
