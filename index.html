<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ⚠️ สลับเอาลิงก์ Web App URL ตัวใหม่ล่าสุดจากข้อดีพล็อยขั้นตอนด้านบนมาใส่ที่นี่แทน
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpTsJ4BDCzpzRUiS_mijoRS5vxbSbYZlKsoANl_gX-qgFWJH6li2gethMj9BlJiR6S/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState("");
            const [tab, setTab] = useState("all");
            
            // สถานะตัวเปิด/ปิดหน้าต่าง Modal ป็อปอัพ
            const [showAddModal, setShowAddModal] = useState(false);
            const [showPayModal, setShowPayModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false); 
            
            // ชุดเก็บข้อมูลฟอร์ม
            const [selectedUser, setSelectedUser] = useState(null);
            const [payAmount, setPayAmount] = useState("");
            const [editId, setEditId] = useState("");
            const [name, setName] = useState("");
            const [loanType, setLoanType] = useState("daily");
            const [principal, setPrincipal] = useState("");
            const [interestRate, setInterestRate] = useState("");
            const [customDays, setCustomDays] = useState(1); 
            const [customCyclePayment, setCustomCyclePayment] = useState("");
            const [loanDate, setLoanDate] = useState(new Date().toISOString().split('T')[0]);

            useEffect(() => { 
                loadAllData(); 
            }, []);

            // ล้างฟอร์แมตตัวเลขคอมมาเพื่อใช้ในการบวกคำนวณแดชบอร์ดอย่างแม่นยำ
            const parseCleanFloat = (val) => {
                if (val === undefined || val === null || val === "") return 0;
                if (typeof val === 'number') return val;
                const clean = val.toString().replace(/,/g, '').trim();
                return parseFloat(clean) || 0;
            };

            // ฟังก์ชันตรวจสอบแมตช์คีย์ข้อมูลระหว่าง โค้ด กับ หัวตาราง Google Sheets ของคุณ
            const getValueIgnoreCase = (obj, targetKey, defaultValue = 0) => {
                if (!obj) return defaultValue;
                
                // ตารางเชื่อมข้อมูลคอลัมน์ (ซ้าย=โค้ด , ขวา=หัวคอลัมน์ใน Sheets ของคุณเป๊ะๆ)
                const map = {
                    "id": "id",
                    "name": "name",
                    "loantype": "loanType",
                    "principal": "principal",
                    "interest": "interest_rate",   // คอลัมน์ E
                    "total": "total_amount",       // คอลัมน์ F
                    "days": "days_count",          // คอลัมน์ G
                    "cycle": "cycle_payment",      // คอลัมน์ H
                    "paid": "paid_amount",         // คอลัมน์ I
                    "balan": "remaining_balance",  // คอลัมน์ J
                    "status": "status",            // คอลัมน์ K
                    "date": "loan_date"            // คอลัมน์ L
                };

                const actualKey = map[targetKey] || targetKey;
                const foundKey = Object.keys(obj).find(k => k.toLowerCase() === actualKey.toLowerCase());
                
                if (foundKey !== undefined && obj[foundKey] !== undefined && obj[foundKey] !== null && obj[foundKey] !== "") {
                    return obj[foundKey];
                }
                return defaultValue;
            };

            // เรียกดึงข้อมูลทั้งหมดจาก Google Sheets ผ่าน API หลังบ้าน
            const loadAllData = async () => {
                setLoading(true);
                try {
                    const resCust = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const dataCust = await resCust.json();
                    console.log("โครงสร้างข้อมูลที่โหลดจริงจากชีต:", dataCust);
                    setCustomers(Array.isArray(dataCust) ? dataCust : []);
                } catch (err) { 
                    console.error("การโหลดข้อมูลจาก API ล้มเหลว:", err);
                } finally {
                    setLoading(false);
                }
            };

            // ฟังก์ชันกลางสำหรับการยิง Request สั่งบันทึกข้อมูล (POST)
            const sendPostRequest = async (payload) => {
                setLoading(true);
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    const resData = await response.json();
                    return resData.status === "success";
                } catch (error) {
                    console.error("การส่งข้อมูล POST มีปัญหา:", error);
                    return true; 
                } finally {
                    setLoading(false);
                }
            };

            // ออกบิลเปิดสัญญาเงินกู้ลูกค้าใหม่
            const handleAddCustomer = async (e) => {
                e.preventDefault();
                setShowAddModal(false);

                const finalInterest = loanType === "float" ? 0 : parseFloat(interestRate);
                const payload = {
                    action: "addCustomer", 
                    name, 
                    loanType,
                    principal: parseFloat(principal),
                    interestRate: finalInterest,
                    customDays: parseInt(customDays) || 1,
                    customCyclePayment: parseFloat(customCyclePayment) || 0,
                    loanDate
                };
                await sendPostRequest(payload);
                alert("🎉 ออกสัญญาเงินกู้ใหม่เรียบร้อยแล้ว!");
                resetForm();
                setTimeout(loadAllData, 1000);
            };

            // ดึงข้อมูลลูกหนี้คนนั้นๆ มาหยอดใส่ฟอร์มเตรียมแก้ไข
            const openEditModal = (c) => {
                const cId = getValueIgnoreCase(c, "id", "").toString();
                const cName = getValueIgnoreCase(c, "name", "").toString();
                const cType = getValueIgnoreCase(c, "loantype", "daily").toString();
                const cPrincipal = getValueIgnoreCase(c, "principal", 0);
                const cInterest = getValueIgnoreCase(c, "interest", 0);
                const cDays = getValueIgnoreCase(c, "days", 1);
                const cCycle = getValueIgnoreCase(c, "cycle", 0);
                const cDate = getValueIgnoreCase(c, "date", "");

                setEditId(cId);
                setName(cName);
                setLoanType(cType); 
                setPrincipal(cPrincipal);
                setInterestRate(cType === "float" ? "" : cInterest);
                setCustomDays(cDays === "-" || !cDays ? 1 : cDays);
                setCustomCyclePayment(cCycle);
                setLoanDate(cDate ? formatCleanDate(cDate) : new Date().toISOString().split('T')[0]);
                setShowEditModal(true);
            };

            // ส่งข้อมูลที่แก้ไขไปอัปเดตลง Google Sheets
            const handleEditCustomer = async (e) => {
                e.preventDefault();
                setShowEditModal(false);

                const finalInterest = loanType === "float" ? 0 : parseFloat(interestRate);
                const payload = {
                    action: "editCustomer", 
                    id: editId, 
                    name, 
                    loanType,
                    principal: parseFloat(principal),
                    interestRate: finalInterest,
                    customDays: parseInt(customDays) || 1,
                    customCyclePayment: parseFloat(customCyclePayment) || 0,
                    loanDate
                };
                await sendPostRequest(payload);
                alert("📝 แก้ไขข้อมูลเรียบร้อยแล้ว!");
                resetForm();
                setTimeout(loadAllData, 1000);
            };

            // บันทึกการชำระเงินของลูกหนี้
            const handlePayment = async (e) => {
                e.preventDefault();
                if (!payAmount || parseFloat(payAmount) <= 0) return;
                if (!confirm(`🪙 ยืนยันบันทึกเก็บยอดจำนวน ${parseFloat(payAmount).toLocaleString()} บาท หรือไม่?`)) return;
                
                setShowPayModal(false);
                const payload = { 
                    action: "recordPayment", 
                    id: selectedUser.id, 
                    amount: parseFloat(payAmount) 
                };
                await sendPostRequest(payload);
                alert(`✅ บันทึกยอดชำระสำเร็จ!`);
                setPayAmount("");
                setTimeout(loadAllData, 1000);
            };

            // หักดิบสำหรับสัญญาดอกลอย (เอาเงินก้อนมาคืนเพื่อจบสัญญา)
            const handleCloseFloatLoan = async (id, name) => {
                if (!confirm(`🚨 ยืนยันให้ลูกหนี้คนนี้หักดิบคืนเงินก้อนเพื่อ "ปิดยอดเงินต้นถาวร" ของคุณ ${name} หรือไม่?`)) return;
                const payload = { action: "closeFloatLoan", id: id };
                await sendPostRequest(payload);
                alert(`🎉 จบสัญญาปิดยอดถาวรของคุณ ${name} สำเร็จ!`);
                setTimeout(loadAllData, 1000);
            };

            // ลบสัญญาลูกหนี้ถาวร
            const handleDeleteCustomer = async (id, name) => {
                if (!confirm(`⚠️ ยืนยันที่จะลบข้อมูลสัญญาของคุณ "${name}" (${id}) ออกจากระบบอย่างถาวรใช่ไหม?`)) return;
                const payload = { action: "deleteCustomer", id: id };
                await sendPostRequest(payload);
                alert("🗑️ ลบข้อมูลสัญญาสำเร็จแล้ว!");
                setTimeout(loadAllData, 1000);
            };

            // ล้างข้อมูลหน้าฟอร์มกลับไปเป็นค่าเริ่มต้น
            const resetForm = () => {
                setEditId("");
                setName(""); 
                setLoanType("daily"); 
                setPrincipal(""); 
                setInterestRate(""); 
                setCustomDays(1); 
                setCustomCyclePayment("");
                setLoanDate(new Date().toISOString().split('T')[0]);
            };

            // ล้างฟอร์แมตข้อความวันที่ให้รองรับ Input HTML เสมอ
            const formatCleanDate = (dateString) => {
                if (!dateString) return "";
                try {
                    const d = new Date(dateString);
                    if (isNaN(d.getTime())) return dateString.split('T')[0];
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                } catch (e) {
                    return dateString.split('T')[0];
                }
            };

            // คำนวณเช็กว่าครบกำหนดชำระรอบวันตามตัวนับวันของชีตหรือไม่
            const isDueToday = (loanDateString, daysCount) => {
                if (!loanDateString) return false;
                const intervalDays = parseInt(daysCount) || 1;
                const today = new Date(); today.setHours(0,0,0,0);
                const loanDate = new Date(loanDateString); loanDate.setHours(0,0,0,0);
                if (today.getTime() === loanDate.getTime()) return false;
                const diffTime = today.getTime() - loanDate.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                return (diffDays > 0 && diffDays % intervalDays === 0);
            };

            // กรองค้นหาข้อความและจัดการแสดงสลับแท็บเมนู
            const filtered = customers.filter(c => {
                const cName = getValueIgnoreCase(c, "name", "").toString();
                const cId = getValueIgnoreCase(c, "id", "").toString();
                const cStatus = getValueIgnoreCase(c, "status", "ค้างชำระ").toString();
                const cDate = getValueIgnoreCase(c, "date", "").toString();
                const cDays = getValueIgnoreCase(c, "days", 1);

                const searchTxt = search.toLowerCase();
                const matchesSearch = cName.toLowerCase().includes(searchTxt) || cId.toLowerCase().includes(searchTxt);
                if (!matchesSearch) return false;
                
                if (tab === "pending") return cStatus !== "จ่ายแล้ว" && isDueToday(cDate, cDays);
                if (tab === "paid") return cStatus === "จ่ายแล้ว";
                return true;
            });

            // คํานวณตัวเลขและสถิติสะสมขึ้นบอร์ดแดชบอร์ดหน้าระบบ
            const summary = customers.reduce((acc, c) => {
                acc.totalPrincipal += parseCleanFloat(getValueIgnoreCase(c, "principal", 0));
                acc.totalInterest += parseCleanFloat(getValueIgnoreCase(c, "interest", 0));
                acc.totalRemaining += parseCleanFloat(getValueIgnoreCase(c, "balan", 0)); 
                acc.totalPaid += parseCleanFloat(getValueIgnoreCase(c, "paid", 0));
                return acc;
            }, { totalPrincipal: 0, totalInterest: 0, totalRemaining: 0, totalPaid: 0 });

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-2xl border-x border-slate-200">
                    
                    {/* ด้านบนระบบ (Header และ ช่องค้นหา) */}
                    <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-4 sticky top-0 z-10 shadow-md">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-lg font-black tracking-tight">🚀 LoanLink Admin</h1>
                            <button onClick={() => { resetForm(); setShowAddModal(true); }} className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm transition-all cursor-pointer">
                                <i className="fa-solid fa-plus"></i> ออกสัญญาใหม่
                            </button>
                        </div>
                        <div className="relative">
                            <input type="text" placeholder="ค้นหาชื่อหรือรหัสลูกหนี้..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-white/15 text-white placeholder-blue-200 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:bg-white focus:text-slate-900" />
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-blue-200"></i>
                        </div>
                    </div>

                    {/* ตารางแสดงภาพรวม Dashboard สรุปยอดเงินทุน */}
                    <div className="p-3 bg-gradient-to-b from-indigo-50 to-slate-50 border-b border-slate-200">
                        <div className="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/60">
                            <span className="text-[11px] font-black uppercase tracking-wider text-slate-400 block mb-2"><i className="fa-solid fa-chart-pie text-indigo-500 mr-1"></i> ภาพรวมเงินทุนสัญญาทั้งหมด</span>
                            <div className="grid grid-cols-2 gap-2">
                                <div className="bg-blue-50/60 rounded-xl p-2.5 border border-blue-100">
                                    <span className="text-[10px] text-blue-600 font-bold block">💰 เงินต้นปล่อยทั้งหมด</span>
                                    <strong className="text-base text-blue-900 font-black">{summary.totalPrincipal.toLocaleString()} บ.</strong>
                                </div>
                                <div className="bg-emerald-50/60 rounded-xl p-2.5 border border-emerald-100">
                                    <span className="text-[10px] text-emerald-600 font-bold block">📈 ดอกเบี้ยตั้งรับในระบบ</span>
                                    <strong className="text-base text-emerald-900 font-black">{summary.totalInterest.toLocaleString()} บ.</strong>
                                </div>
                                <div className="bg-purple-50/60 rounded-xl p-2.5 border border-purple-100">
                                    <span className="text-[10px] text-purple-600 font-bold block">📥 ต้นทุนรวมที่เก็บคืนแล้ว</span>
                                    <strong className="text-base text-purple-900 font-black">{summary.totalPaid.toLocaleString()} บ.</strong>
                                </div>
                                <div className="bg-rose-50/60 rounded-xl p-2.5 border border-rose-100">
                                    <span className="text-[10px] text-rose-600 font-bold block">💸 ยอดเงินต้นค้างระบบตอนนี้</span>
                                    <strong className="text-base text-rose-600 font-black">{summary.totalRemaining.toLocaleString()} บ.</strong>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* เมนูแท็บแถบตัวเลือกเพื่อกรองสถานะ */}
                    <div className="grid grid-cols-3 gap-1 bg-white p-1.5 border-b border-slate-200">
                        <button onClick={() => setTab("all")} className={`py-2 text-xs font-bold rounded-lg ${tab === 'all' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500'}`}>ทั้งหมด ({customers.length})</button>
                        <button onClick={() => setTab("pending")} className={`py-2 text-xs font-bold rounded-lg ${tab === 'pending' ? 'bg-amber-50 text-amber-700' : 'text-slate-500'}`}>ต้องเก็บวันนี้</button>
                        <button onClick={() => setTab("paid")} className={`py-2 text-xs font-bold rounded-lg ${tab === 'paid' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-500'}`}>ปิดสัญญาแล้ว</button>
                    </div>

                    {/* กล่องรายการรายชื่อลูกหนี้กู้เงิน */}
                    <div className="flex-1 p-3 space-y-3 overflow-y-auto">
                        {loading ? (
                            <div className="text-center py-20 text-slate-400"><i className="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-3"></i> กำลังเรียกข้อมูล...</div>
                        ) : filtered.length === 0 ? (
                            <div className="text-center py-20 text-slate-400 text-sm">📭 ไม่พบข้อมูลรายชื่อลูกหนี้ในระบบ</div>
                        ) : (
                            filtered.map(c => {
                                const cId = getValueIgnoreCase(c, "id", "").toString();
                                const cName = getValueIgnoreCase(c, "name", "").toString();
                                const cType = getValueIgnoreCase(c, "loantype", "daily").toString();
                                const cTotal = getValueIgnoreCase(c, "total", 0);
                                const cRemaining = getValueIgnoreCase(c, "balan", 0); 
                                const cPaid = getValueIgnoreCase(c, "paid", 0);
                                const cDays = getValueIgnoreCase(c, "days", 1);
                                const cCycle = getValueIgnoreCase(c, "cycle", 0);
                                const cStatus = getValueIgnoreCase(c, "status", "ค้างชำระ").toString();
                                
                                return (
                                    <div key={cId} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-xs">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h4 className="font-black text-slate-800 text-base">{cName}</h4>
                                                <span className="text-[11px] text-slate-400 font-mono block">ID: {cId} | <span className="text-indigo-600 font-bold">{cType === "float" ? "🏷️ ดอกลอย" : "🏷️ รายวัน"}</span></span>
                                            </div>
                                            <div className="flex items-center gap-1">
                                                <button onClick={() => openEditModal(c)} className="text-amber-600 p-1 bg-amber-50 rounded-md border border-amber-100 text-xs cursor-pointer"><i className="fa-solid fa-pen-to-square"></i></button>
                                                <button onClick={() => handleDeleteCustomer(cId, cName)} className="text-rose-500 p-1 bg-rose-50 rounded-md border border-rose-100 text-xs cursor-pointer"><i className="fa-solid fa-trash-can"></i></button>
                                                <span className={`text-[11px] font-black px-2 py-0.5 rounded-full ${cStatus === "จ่ายแล้ว" ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>{cStatus}</span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-2.5 mb-3">
                                            {cType === "daily" ? (
                                                <>
                                                    <div>ยอดรวมสัญญา: <strong className="text-slate-900">{parseCleanFloat(cTotal).toLocaleString()} บ.</strong></div>
                                                    <div>ชำระรวมสะสม: <strong className="text-emerald-600">{parseCleanFloat(cPaid).toLocaleString()} บ.</strong></div>
                                                    <div className="col-span-2">ยอดหนี้เหลือสุทธิ: <strong className="text-rose-600 text-sm font-black">{parseCleanFloat(cRemaining).toLocaleString()} บ.</strong></div>
                                                </>
                                            ) : (
                                                <>
                                                    <div>เงินต้นลอยคงค้าง: <strong className="text-slate-900 text-sm font-black">{parseCleanFloat(cRemaining).toLocaleString()} บ.</strong></div>
                                                    <div>รับดอกรวมแล้ว: <strong className="text-emerald-600">{parseCleanFloat(cPaid).toLocaleString()} บ.</strong></div>
                                                </>
                                            )}
                                            <div className="bg-slate-50 col-span-2 p-2 rounded-xl mt-1 flex justify-between items-center border border-slate-100">
                                                <span>💰 ยอดเก็บต่องวด: <strong className="text-indigo-600">{parseCleanFloat(cCycle).toLocaleString()} บ.</strong></span>
                                                <span>รอบส่ง: <strong className="text-slate-700">ทุก {cDays} วัน</strong></span>
                                            </div>
                                        </div>

                                        {cStatus !== "จ่ายแล้ว" && (
                                            <div className="flex gap-2">
                                                <button onClick={() => { setSelectedUser({id: cId, name: cName}); setPayAmount(cCycle); setShowPayModal(true); }} className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-xs cursor-pointer">
                                                    {cType === "float" ? "🪙 บันทึกเก็บดอกงวดนี้" : "🪙 เก็บค่างวดประจำวัน"}
                                                </button>
                                                {cType === "float" && (
                                                    <button onClick={() => handleCloseFloatLoan(cId, cName)} className="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-2 rounded-xl text-xs cursor-pointer">🚨 ปิดต้นถาวร</button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })
                        )}
                    </div>

                    {/* ป็อปอัพหน้าต่าง (Modal): ออกบิลสร้างสัญญากู้เงินชุดใหม่ */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-base font-black text-slate-800 mb-4">ออกสัญญาเงินกู้ใหม่</h3>
                                <form onSubmit={handleAddCustomer} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ชื่อ-นามสกุล ลูกหนี้</label>
                                        <input type="text" required value={name} onChange={(e) => setName(e.target.value)} placeholder="กรอกชื่อ-นามสกุล" className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ประเภทเงินกู้ระบบ</label>
                                        <select value={loanType} onChange={(e) => setLoanType(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none">
                                            <option value="daily">รายวัน (ตัดต้นตัดดอก)</option>
                                            <option value="float">ดอกลอย</option>
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">เงินต้น (บาท)</label>
                                            <input type="number" required value={principal} onChange={(e) => setPrincipal(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">ดอกเบี้ยรวม (บาท)</label>
                                            <input type="number" required={loanType === "daily"} disabled={loanType === "float"} value={loanType === "float" ? "0" : interestRate} onChange={(e) => setInterestRate(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none disabled:bg-slate-100 text-slate-400" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">ระยะเวลารอบเก็บ (วัน)</label>
                                            <input type="number" min="1" value={customDays} onChange={(e) => setCustomDays(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">ยอดส่งต่องวด (บาท)</label>
                                            <input type="number" required value={customCyclePayment} onChange={(e) => setCustomCyclePayment(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">วันที่เริ่มต้นเปิดบิลสัญญา</label>
                                        <input type="date" value={loanDate} onChange={(e) => setLoanDate(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowAddModal(false)} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold cursor-pointer">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer">บันทึกเปิดบิล</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ป็อปอัพหน้าต่าง (Modal): แก้ไขโครงสร้างข้อมูลเดิม */}
                    {showEditModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-base font-black text-slate-800 mb-4">แก้ไขข้อตกลงเอกสารสัญญา</h3>
                                <form onSubmit={handleEditCustomer} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ชื่อ-นามสกุล ลูกหนี้</label>
                                        <input type="text" required value={name} onChange={(e) => setName(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ประเภทเงื่อนไขระบบ</label>
                                        <select value={loanType} onChange={(e) => setLoanType(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none">
                                            <option value="daily">รายวัน (ตัดต้นตัดดอก)</option>
                                            <option value="float">ดอกลอย</option>
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">เงินต้น (บาท)</label>
                                            <input type="number" required value={principal} onChange={(e) => setPrincipal(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">ดอกเบี้ยรวม (บาท)</label>
                                            <input type="number" required={loanType === "daily"} disabled={loanType === "float"} value={loanType === "float" ? "0" : interestRate} onChange={(e) => setInterestRate(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none disabled:bg-slate-100 text-slate-400" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">รอบระยะส่ง (วัน)</label>
                                        <input type="number" min="1" value={customDays} onChange={(e) => setCustomDays(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ยอดจ่ายต่องวด (บาท)</label>
                                        <input type="number" required value={customCyclePayment} onChange={(e) => setCustomCyclePayment(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">วันที่ปล่อยกู้เดิม</label>
                                        <input type="date" value={loanDate} onChange={(e) => setLoanDate(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => { setShowEditModal(false); resetForm(); }} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold cursor-pointer">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-amber-500 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer">อัปเดตการแก้ไข</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ป็อปอัพหน้าต่าง (Modal): ชำระเงินรับค่างวดสะสม */}
                    {showPayModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                                <h3 className="text-base font-black text-slate-800 mb-2">บันทึกจ่ายเงินลูกหนี้</h3>
                                <p className="text-xs text-slate-500 mb-4">รายชื่อ: <span className="text-slate-800 font-bold">{selectedUser?.name}</span></p>
                                <form onSubmit={handlePayment} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ยอดเงินที่ชำระจริง (บาท)</label>
                                        <input type="number" required value={payAmount} onChange={(e) => setPayAmount(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="ระบุตัวเลขเงินทุน" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => { setShowPayModal(false); setPayAmount(""); }} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold cursor-pointer">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer">ยืนยันทำรายการ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
