<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ⚠️ อย่าลืมใส่ลิงก์ Web App URL ของคุณที่นี่ก่อนใช้งาน
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHB_fDwEWthk-HO0hI2vfYSRYJObR9X2k05YDCTxwN7pO5G1M6hjwuD-0y2cNvbk1i/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [profiles, setProfiles] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState("");
            const [tab, setTab] = useState("all"); 
            
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedUser, setSelectedUser] = useState(null);
            const [payAmount, setPayAmount] = useState("");

            useEffect(() => { loadAllData(); }, []);

            const parseCleanFloat = (val) => {
                if (val === undefined || val === null || val === "") return 0;
                if (typeof val === 'number') return val;
                const clean = val.toString().replace(/,/g, '').trim();
                return parseFloat(clean) || 0;
            };

            const getValueFromSheet = (obj, targetKey, defaultValue = "") => {
                if (!obj) return defaultValue;
                if (obj[targetKey] !== undefined && obj[targetKey] !== null) {
                    return obj[targetKey];
                }
                return defaultValue;
            };

            const loadAllData = async () => {
                setLoading(true);
                try {
                    const resCust = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const dataCust = await resCust.json();
                    let dataProf = [];
                    try {
                        const resProf = await fetch(`${SCRIPT_URL}?action=getProfiles`);
                        dataProf = await resProf.json();
                    } catch(e) { console.log("Profile log empty"); }
                    
                    setCustomers(Array.isArray(dataCust) ? dataCust : []);
                    setProfiles(Array.isArray(dataProf) ? dataProf : []);
                } catch (err) { 
                    console.error("Error loading data:", err); 
                } finaly {
                    setLoading(false);
                }
            };

            const sendPostRequest = async (payload) => {
                setLoading(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    return true;
                } catch (error) {
                    console.error("Post Error:", error);
                    return false;
                } finally {
                    setLoading(false);
                }
            };

            const handlePayment = async (e) => {
                e.preventDefault();
                if (!payAmount || parseFloat(payAmount) <= 0) return;
                
                if (!confirm(`🪙 ยืนยันบันทึกการจัดเก็บเงินจำนวน ${parseFloat(payAmount).toLocaleString()} บาท?`)) return;
                
                setShowPayModal(false);
                const payload = { 
                    action: "recordPayment", 
                    id: selectedUser.id, 
                    amount: parseFloat(payAmount) 
                };

                const success = await sendPostRequest(payload);
                if (success) {
                    alert(`✅ บันทึกยอดจัดเก็บสำเร็จ!`);
                    setPayAmount("");
                    setTimeout(loadAllData, 1000);
                }
            };

            // ฟังก์ชันสำหรับกดปุ่มปิดต้นดอกลอยโดยเฉพาะ
            const handleCloseFloatLoan = async (cust) => {
                const remainingBalan = parseCleanFloat(getValueFromSheet(cust, "remaining_balance", 0));
                if (!confirm(`🚨 คุณมั่นใจใช่ไหมว่าต้องการ "ปิดต้น" ของคุณ ${cust.name}?\nลูกหนี้นำเงินต้นก้อนสุดท้ายจำนวน ${remainingBalan.toLocaleString()} บาท มาเคลียร์ปิดสัญญานี้ถาวรแล้ว`)) return;
                
                const payload = {
                    action: "closeFloatLoan",
                    id: cust.id
                };
                
                const success = await sendPostRequest(payload);
                if (success) {
                    alert(`🎉 ปิดสัญญากู้ดอกลอยสำเร็จ สัญญาเด้งไปหน้าจ่ายแล้วเรียบร้อยครับ!`);
                    setTimeout(loadAllData, 1000);
                }
            };

            const checkIfPaidSuccess = (c) => {
                const cStatus = getValueFromSheet(c, "status", "ค้างชำระ").toString();
                return cStatus === "จ่ายแล้ว";
            };

            // คำนวณสรุป Dashboard ด้านบน
            const totalPrincipal = customers.reduce((sum, c) => sum + parseCleanFloat(getValueFromSheet(c, "principal", 0)), 0);
            const totalRemaining = customers.reduce((sum, c) => sum + parseCleanFloat(getValueFromSheet(c, "remaining_balance", 0)), 0);
            const totalPaid = customers.reduce((sum, c) => sum + parseCleanFloat(getValueFromSheet(c, "paid_amount", 0)), 0);
            const calculatedInterest = customers.reduce((sum, c) => sum + parseCleanFloat(getValueFromSheet(c, "interest_rate", 0)), 0);

            const filtered = customers.filter(c => {
                const cName = getValueFromSheet(c, "name", "").toString();
                const cId = getValueFromSheet(c, "id", "").toString();
                const searchTxt = search.toLowerCase();
                const matchesSearch = cName.toLowerCase().includes(searchTxt) || cId.toLowerCase().includes(searchTxt);
                if (!matchesSearch) return false;
                
                const isPaid = checkIfPaidSuccess(c);
                if (tab === "pending") return !isPaid;
                if (tab === "paid") return isPaid;
                return true; 
            });

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-2xl border-x border-slate-200">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-4 sticky top-0 z-10 shadow-md">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-lg font-black tracking-tight">🚀 LoanLink Admin</h1>
                            <div className="flex gap-1.5">
                                <a href="profile.html" className="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1">
                                    <i className="fa-solid fa-address-book"></i> สมุดประวัติ
                                </a>
                            </div>
                        </div>
                        <div className="relative mb-4">
                            <input type="text" placeholder="ค้นหาชื่อลูกหนี้ หรือรหัสสัญญา..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-white/15 text-white placeholder-blue-200 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:bg-white focus:text-slate-900 transition-all" />
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-blue-200 pointer-events-none"></i>
                        </div>

                        {/* Dashboard ข้อมูลทุนและดอกเบี้ย */}
                        <div className="bg-white text-slate-800 rounded-2xl p-4 shadow-inner grid grid-cols-2 gap-3">
                            <div className="bg-blue-50/70 p-3 rounded-xl border border-blue-100">
                                <p className="text-[10px] font-bold text-slate-500">💰 เงินต้นปล่อยทั้งหมด</p>
                                <p className="text-base font-black text-blue-700">{totalPrincipal.toLocaleString()} บ.</p>
                            </div>
                            <div className="bg-emerald-50/70 p-3 rounded-xl border border-emerald-100">
                                <p className="text-[10px] font-bold text-slate-500">📈 ดอกเบี้ยตามระบบ</p>
                                <p className="text-base font-black text-emerald-700">{calculatedInterest.toLocaleString()} บ.</p>
                            </div>
                            <div className="bg-purple-50/70 p-3 rounded-xl border border-purple-100">
                                <p className="text-[10px] font-bold text-slate-500">📥 เก็บยอดกลับมาแล้วทั้งหมด</p>
                                <p className="text-base font-black text-purple-700">{totalPaid.toLocaleString()} บ.</p>
                            </div>
                            <div className="bg-rose-50/70 p-3 rounded-xl border border-rose-100">
                                <p className="text-[10px] font-bold text-slate-500">📉 ยอดค้างรอเก็บรวม</p>
                                <p className="text-base font-black text-rose-700">{totalRemaining.toLocaleString()} บ.</p>
                            </div>
                        </div>
                    </div>

                    {/* Tabs */}
                    <div className="grid grid-cols-3 gap-1 bg-white p-1.5 border-b border-slate-200">
                        <button onClick={() => setTab("all")} className={`py-2 text-xs font-bold rounded-lg cursor-pointer ${tab === 'all' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500'}`}>ทั้งหมด ({customers.length})</button>
                        <button onClick={() => setTab("pending")} className={`py-2 text-xs font-bold rounded-lg cursor-pointer ${tab === 'pending' ? 'bg-amber-50 text-amber-700' : 'text-slate-500'}`}>ค้างชำระ ({customers.filter(c=>!checkIfPaidSuccess(c)).length})</button>
                        <button onClick={() => setTab("paid")} className={`py-2 text-xs font-bold rounded-lg cursor-pointer ${tab === 'paid' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-500'}`}>จ่ายแล้ว ({customers.filter(c=>checkIfPaidSuccess(c)).length})</button>
                    </div>

                    {/* List */}
                    <div className="flex-1 p-3 space-y-3 overflow-y-auto">
                        {loading ? (
                            <div className="text-center py-20 text-slate-400"><i className="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-3"></i><p className="text-xs">กำลังโหลดข้อมูล...</p></div>
                        ) : filtered.length === 0 ? (
                            <div className="text-center py-20 text-slate-400 text-sm">📭 ไม่พบข้อมูลข้อมูล</div>
                        ) : (
                            filtered.map(c => {
                                const cId = getValueFromSheet(c, "id").toString();
                                const cName = getValueFromSheet(c, "name").toString();
                                const cType = getValueFromSheet(c, "loanType").toString(); 
                                const cTotal = getValueFromSheet(c, "total_amount", 0);
                                const cRemaining = getValueFromSheet(c, "remaining_balance", 0); 
                                const cDays = getValueFromSheet(c, "days_count", 0); 
                                const cCycle = getValueFromSheet(c, "cycle_payment", 0); 
                                const cPaid = getValueFromSheet(c, "paid_amount", 0);

                                const hasProfile = profiles.some(p => getValueFromSheet(p, "id").toString() === cId);
                                const isPaid = checkIfPaidSuccess(c);

                                return (
                                    <div key={cId} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm relative">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h4 className="font-black text-slate-800 text-base">{cName}</h4>
                                                <span className="text-[11px] text-slate-400 font-mono block">ID: {cId}</span>
                                            </div>
                                            <div>
                                                <span className={`text-[11px] font-black px-2.5 py-1 rounded-full ${isPaid ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>
                                                    {isPaid ? "จ่ายแล้ว" : "ค้างชำระ"}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="mb-3 flex flex-wrap gap-1">
                                            {hasProfile ? (
                                                <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">✓ ตรวจพบประวัติแล้ว</span>
                                            ) : (
                                                <span className="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-md border border-rose-200">⚠️ ยังไม่ได้ลงประวัติส่วนตัว</span>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-2 gap-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-2.5 mb-3">
                                            <div>ยอดเงินต้นปล่อย: <strong className="text-slate-900">{parseCleanFloat(cTotal).toLocaleString()} บ.</strong></div>
                                            <div>ยอดค้างชำระ: <strong className="text-rose-600">{parseCleanFloat(cRemaining).toLocaleString()} บ.</strong></div>
                                            <div>รอบส่งงาน: <span className="text-indigo-600 font-bold">ทุก ๆ {cDays} วัน</span></div>
                                            <div>ยอดจัดเก็บต่อรอบ: <span className="text-emerald-600 font-black">{parseCleanFloat(cCycle).toLocaleString()} บ.</span></div>
                                            <div className="col-span-2 text-slate-400 text-[11px]">ยอดส่งสะสมแล้ว: <span className="text-blue-600 font-bold">{parseCleanFloat(cPaid).toLocaleString()} บ.</span></div>
                                            <div className="col-span-2 text-slate-500 font-bold text-[11px]">ประเภท: {cType === "float" ? "ดอกลอย (ส่งเฉพาะดอกเบี้ย)" : "รายวัน (หักทั้งต้นทั้งดอก)"}</div>
                                        </div>

                                        {/* ควบคุมปุ่มกดสำหรับสถานะค้างชำระ */}
                                        {!isPaid && (
                                            <div className="flex flex-col gap-1.5">
                                                <button onClick={() => { setSelectedUser({id: cId, name: cName}); setPayAmount(cCycle); setShowPayModal(true); }} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-xs shadow-sm transition-all cursor-pointer">
                                                    🪙 {cType === "float" ? "บันทึกการส่งดอกรอบนี้" : "บันทึกการชำระค่างวด"}
                                                </button>
                                                
                                                {/* 🌟 ปุ่มลับเฉพาะสัญญาลอย: กดปิดยอดเงินต้นเมื่อเอาเงินก้อนมาตัด */}
                                                {cType === "float" && (
                                                    <button onClick={() => handleCloseFloatLoan(c)} className="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-1.5 rounded-xl text-[11px] shadow-sm transition-all cursor-pointer">
                                                        🚨 ลูกหนี้นำเงินก้อนมา "ปิดต้นถาวร"
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })
                        )}
                    </div>

                    {/* Modal Payment */}
                    {showPayModal && selectedUser && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                                <h3 className="text-base font-black text-slate-800 mb-4">🪙 บันทึกรับยอดเงิน: {selectedUser.name}</h3>
                                <form onSubmit={handlePayment} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">จำนวนเงินที่เก็บได้รอบนี้ (บาท)</label>
                                        <input type="number" required value={payAmount} onChange={(e) => setPayAmount(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-3 text-2xl font-black text-indigo-600 bg-slate-50 text-center focus:outline-none" />
                                    </div>
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowPayModal(false)} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold cursor-pointer">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer">ยืนยันรับยอดเงิน</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
