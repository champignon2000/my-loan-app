<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารและติดตามค่างวดลูกหนี้</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ⚠️ อย่าลืมระบุ Web App URL ของคุณที่นี่
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-ao2jGyIkI3xbmhZWwbjXiJFC3XM0Ed58c6lh_AEb-NwJhRiyLLrqSmpB6h_YsweS/exec";

        function App() {
            const [customers, setCustomers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState("");
            const [tab, setTab] = useState("all"); 
            
            const [showPayModal, setShowPayModal] = useState(false);
            const [selectedUser, setSelectedUser] = useState(null);
            const [payAmount, setPayAmount] = useState("");

            useEffect(() => { loadAllData(); }, []);

            const parseCleanFloat = (val) => {
                if (val === undefined || val === null || val === "") return 0;
                if (typeof val === 'number') return val;
                const clean = val.toString().replace(/,/g, '').trim();
                return parseFloat(clean) || 0;
            };

            const getValueFromSheet = (obj, targetKey, defaultValue = "") => {
                if (!obj) return defaultValue;
                if (obj[targetKey] !== undefined && obj[targetKey] !== null) {
                    return obj[targetKey];
                }
                return defaultValue;
            };

            const loadAllData = async () => {
                setLoading(true);
                try {
                    const resCust = await fetch(`${SCRIPT_URL}?action=getCustomers`);
                    const dataCust = await resCust.json();
                    setCustomers(Array.isArray(dataCust) ? dataCust : []);
                } catch (err) { 
                    console.error(err); 
                } finally {
                    setLoading(false);
                }
            };

            const handlePayment = async (e) => {
                e.preventDefault();
                if (!payAmount || parseFloat(payAmount) <= 0) return;
                if (!confirm(`🪙 ยืนยันบันทึกยอดส่งดอกเบี้ย/ค่างวดจำนวน ${parseFloat(payAmount).toLocaleString()} บาท?`)) return;
                
                setShowPayModal(false);
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "recordPayment", id: selectedUser.id, amount: parseFloat(payAmount) })
                    });
                    alert(`✅ บันทึกยอดสำเร็จ!`);
                    setPayAmount("");
                    setTimeout(loadAllData, 1000);
                } catch(err) { console.error(err); }
            };

            // ฟังก์ชันยิงคำสั่งไปเคลียร์สัญญากู้ดอกลอยให้เป็น 0 (ปิดสัญญา)
            const handleCloseFloatLoan = async (cust) => {
                if (!confirm(`🚨 ยืนยันการ "ปิดยอดเงินต้นถาวร" ของคุณ ${cust.name}?\nระบบจะเคลียร์ยอดค้างชำระใน Google Sheets เป็น 0 และจบสัญญานี้ทันที`)) return;
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "closeFloatLoan", id: cust.id })
                    });
                    alert(`🎉 ปิดสัญญาเงินต้นสำเร็จเสร็จสิ้นครับ!`);
                    setTimeout(loadAllData, 1000);
                } catch(err) { console.error(err); }
            };

            // ตรวจสอบสถานะ: เชื่อจากข้อความในช่อง status ของ Google Sheets เท่านั้น ไม่คำนวณเลขอัตโนมัติเอง
            const checkIfPaidSuccess = (c) => {
                const cStatus = getValueFromSheet(c, "status", "ค้างชำระ").toString().trim();
                return cStatus === "จ่ายแล้ว";
            };

            const filtered = customers.filter(c => {
                const cName = getValueFromSheet(c, "name", "").toString();
                const cId = getValueFromSheet(c, "id", "").toString();
                const matchesSearch = cName.toLowerCase().includes(search.toLowerCase()) || cId.toLowerCase().includes(search.toLowerCase());
                if (!matchesSearch) return false;
                
                const isPaid = checkIfPaidSuccess(c);
                if (tab === "pending") return !isPaid;
                if (tab === "paid") return isPaid;
                return true; 
            });

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-2xl border-x border-slate-200">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-4 sticky top-0 z-10 shadow-md">
                        <h1 className="text-lg font-black tracking-tight mb-3">🚀 LoanLink Admin</h1>
                        <div className="relative">
                            <input type="text" placeholder="ค้นหาชื่อลูกหนี้..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-white/15 text-white placeholder-blue-200 pl-10 pr-4 py-2 rounded-xl text-sm focus:outline-none focus:bg-white focus:text-slate-900" />
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-blue-200 pointer-events-none"></i>
                        </div>
                    </div>

                    {/* Tabs */}
                    <div className="grid grid-cols-3 gap-1 bg-white p-1.5 border-b border-slate-200 text-center">
                        <button onClick={() => setTab("all")} className={`py-2 text-xs font-bold rounded-lg cursor-pointer ${tab === 'all' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500'}`}>ทั้งหมด ({customers.length})</button>
                        <button onClick={() => setTab("pending")} className={`py-2 text-xs font-bold rounded-lg cursor-pointer ${tab === 'pending' ? 'bg-amber-50 text-amber-700' : 'text-slate-500'}`}>ค้างชำระ ({customers.filter(c=>!checkIfPaidSuccess(c)).length})</button>
                        <button onClick={() => setTab("paid")} className={`py-2 text-xs font-bold rounded-lg cursor-pointer ${tab === 'paid' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-500'}`}>จ่ายแล้ว ({customers.filter(c=>checkIfPaidSuccess(c)).length})</button>
                    </div>

                    {/* รายชื่อการ์ดลูกหนี้ */}
                    <div className="flex-1 p-3 space-y-3 overflow-y-auto">
                        {loading ? (
                            <div className="text-center py-20 text-slate-400"><i className="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-600 mb-2"></i><p className="text-xs">กำลังดึงข้อมูลจากตาราง...</p></div>
                        ) : filtered.length === 0 ? (
                            <div className="text-center py-20 text-slate-400 text-sm">📭 ไม่พบข้อมูลข้อมูล</div>
                        ) : (
                            filtered.map(c => {
                                const cId = getValueFromSheet(c, "id").toString();
                                const cName = getValueFromSheet(c, "name").toString();
                                
                                // 🎯 ดึงแมปปิ้งข้อมูลตรงล็อกตามหัวข้อในตารางกูเกิ้ลชีตของคุณเป๊ะ ๆ
                                const cType = getValueFromSheet(c, "loanType").toString().trim();
                                const cTotalAmount = getValueFromSheet(c, "total_amount", 0);
                                const cRemainingBalance = getValueFromSheet(c, "remaining_balance", 0); 
                                const cDaysCount = getValueFromSheet(c, "days_count", 0); 
                                const cCyclePayment = getValueFromSheet(c, "cycle_payment", 0); 
                                const cPaidAmount = getValueFromSheet(c, "paid_amount", 0);

                                const isPaid = checkIfPaidSuccess(c);
                                const isFloat = cType === "float" || cType === "ดอกลอย";

                                return (
                                    <div key={cId} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h4 className="font-black text-slate-800 text-base">{cName}</h4>
                                                <span className="text-[11px] text-slate-400 font-mono block">ID: {cId}</span>
                                            </div>
                                            <span className={`text-[11px] font-black px-2.5 py-1 rounded-full ${isPaid ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>
                                                {isPaid ? "จ่ายแล้ว" : "ค้างชำระ"}
                                            </span>
                                        </div>

                                        {/* ข้อมูลดิบจากชีต */}
                                        <div className="grid grid-cols-2 gap-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-2.5 mb-3">
                                            <div>ยอดรวมสัญญา: <strong className="text-slate-900">{parseCleanFloat(cTotalAmount).toLocaleString()} บ.</strong></div>
                                            <div>ยอดค้างชำระ: <strong className="text-rose-600">{parseCleanFloat(cRemainingBalance).toLocaleString()} บ.</strong></div>
                                            <div>รอบส่งงาน: <span className="text-indigo-600 font-bold">ทุก ๆ {cDaysCount} วัน</span></div>
                                            <div>ยอดจัดเก็บต่อรอบ: <span className="text-emerald-600 font-black">{parseCleanFloat(cCyclePayment).toLocaleString()} บ.</span></div>
                                            <div className="col-span-2 text-slate-400 text-[11px]">ยอดส่งสะสมแล้ว: <span className="text-blue-600 font-bold">{parseCleanFloat(cPaidAmount).toLocaleString()} บ.</span></div>
                                            <div className="col-span-2 text-slate-500 font-bold text-[11px]">ประเภทสัญญา: {isFloat ? "ดอกลอย (ส่งเฉพาะดอกเบี้ย)" : "รายวัน (หักต้นหักดอก)"}</div>
                                        </div>

                                        {/* พื้นที่แสดงแอ็กชันปุ่มกด */}
                                        <div className="flex flex-col gap-2">
                                            {/* ปุ่มที่ 1: บันทึกรับเงินงวด/รับดอกเบี้ยปกติ (สามารถกดส่งได้เรื่อย ๆ ตราบใดที่สถานะในชีตยังไม่สั่งว่า จ่ายแล้ว) */}
                                            {!isPaid && (
                                                <button onClick={() => { setSelectedUser({id: cId, name: cName}); setPayAmount(cCyclePayment); setShowPayModal(true); }} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition-all cursor-pointer">
                                                    🪙 {isFloat ? "บันทึกการส่งดอกรอบนี้" : "บันทึกการชำระค่างวด"}
                                                </button>
                                            )}
                                            
                                            {/* 🚨 ปุ่มปิดยอดเงินต้นถาวร (สำหรับสัญญาดอกลอย): จะถูกบังคับให้แสดงผลหราค้างไว้ตลอดจนกว่าคุณจะกดมัน เพื่อส่งคำสั่งไปปิดสัญญานี้อย่างสมบูรณ์ */}
                                            {isFloat && !isPaid && (
                                                <button onClick={() => handleCloseFloatLoan(c)} className="w-full bg-linear-to-r from-red-600 to-amber-600 hover:from-red-700 hover:to-amber-700 text-white font-black py-3 rounded-xl text-xs shadow-md transition-all cursor-pointer border border-red-700 block text-center">
                                                    🚨 ลูกหนี้นำเงินก้อนมา "ปิดยอดเงินต้นถาวร"
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>

                    {/* Modal ป๊อปอัพกรอกตัวเลขค่างวด */}
                    {showPayModal && selectedUser && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                                <h3 className="text-base font-black text-slate-800 mb-4">🪙 บันทึกรับยอดเงิน: {selectedUser.name}</h3>
                                <form onSubmit={handlePayment} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">จำนวนเงิน (บาท)</label>
                                        <input type="number" required value={payAmount} onChange={(e) => setPayAmount(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-3 text-2xl font-black text-indigo-600 bg-slate-50 text-center" />
                                    </div>
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowPayModal(false)} className="flex-1 bg-slate-100 text-slate-500 py-2.5 rounded-xl text-xs font-bold cursor-pointer">ยกเลิก</button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer">ยืนยันรับยอด</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
